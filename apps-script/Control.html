<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#0e0d0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Régie MC, Gala LIONGATE. Manrope only, logo colours, phone-first. */
:root{--bg:#0e0d0c;--s1:#171513;--s2:#211e1b;--s3:#2b2723;--line:rgba(247,235,198,.12);--text:#f4f0e6;--t2:#bdb6a8;--t3:#8f897d;
  --gold:#f2aa1e;--red:#dc3c14;--green:#3fb67c;--cream:#f7ebc6;--r:14px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:52px;touch-action:manipulation;transition:transform .18s var(--spring),background-color .25s var(--ease),opacity .25s,box-shadow .25s}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));background:rgba(14,13,12,.92);border-bottom:1px solid var(--line)}
.brand{font-size:17px;font-weight:800;letter-spacing:.01em}
.brand small{display:block;font-size:12px;font-weight:700;color:var(--gold)}
.clock{text-align:right;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.clock small{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;font-weight:600;color:var(--t2)}
.clock small i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:sync 2s var(--ease) infinite}
.clock small.bad{color:#ff9b7d}.clock small.bad i{background:var(--red);animation:none}
@keyframes sync{0%{box-shadow:0 0 0 0 rgba(63,182,124,.55)}80%,100%{box-shadow:0 0 0 7px rgba(63,182,124,0)}}
main{max-width:620px;margin:0 auto;padding:16px}

/* PIN */
.pin{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;animation:rise .5s var(--ease)}
.pin label{display:block;font-weight:800;font-size:17px;margin-bottom:12px}
.pin .row{display:flex;gap:10px}
.pin input{flex:1;min-width:0;font:inherit;font-size:24px;font-weight:800;letter-spacing:.35em;padding:12px 16px;border:2px solid var(--s3);border-radius:12px;background:var(--bg);color:var(--text);transition:border-color .25s}
.pin input:focus{border-color:var(--gold);outline:none}
.pin button{background:var(--gold);color:#151311;font-weight:800;padding:0 20px}
.pin p{margin:10px 0 0;color:var(--t2);font-size:14px}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Current step: countdown ring */
.now{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;overflow:hidden}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--s3);stroke-width:9}
.ring .arc{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .6s linear,stroke .4s}
.now.paused .ring .arc{stroke:var(--cream)}
.now.hot .ring .arc{stroke:var(--red)}
.now.over .ring .arc{stroke:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.ring .big{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .big.l6{font-size:26px}.ring .big.l7{font-size:21px}
.now.over .big{color:#ff9b7d}.now.hot .big{color:var(--gold)}
.over-chip{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 8px}
.ring .big.tick{animation:tick .35s var(--ease)}
@keyframes tick{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.now .lbl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--gold)}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px}
.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:sync 1.6s var(--ease) infinite}
.badge{display:inline-block;background:var(--cream);color:#151311;font-weight:800;font-size:12px;border-radius:6px;padding:3px 8px;animation:pop .35s var(--spring)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.now h1{font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.2;margin:6px 0 8px}
.now h1.swap{animation:rise .45s var(--ease)}
.now .sub{font-size:14px;color:var(--t2)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn-next{grid-column:1/-1;position:relative;overflow:hidden;background:var(--gold);color:#151311;font-size:20px;font-weight:800;min-height:74px;text-align:left;padding:12px 18px;display:flex;flex-direction:column;justify-content:center}
.btn-next::after{content:"";position:absolute;right:18px;top:50%;width:12px;height:12px;border-top:3px solid #151311;border-right:3px solid #151311;transform:translateY(-50%) rotate(45deg);transition:transform .25s var(--ease)}
.btn-next:active:not(:disabled)::after{transform:translate(6px,-50%) rotate(45deg)}
.btn-next span{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:2px;padding-right:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-pause{grid-column:1/-1;background:var(--s2);color:var(--text);font-size:19px;font-weight:800;min-height:60px;border:1px solid var(--line)}
.btn-pause.on{background:var(--cream);color:#151311;animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(247,235,198,.12)}}
.adj{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.adj button{background:var(--s1);border:1px solid var(--line);font-weight:800;font-size:17px;min-height:56px}
.adj button small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--t2);margin-top:2px}
.adj button.flash{animation:flash .5s var(--ease)}
@keyframes flash{0%{background:var(--gold);color:#151311}100%{background:var(--s1)}}

/* Running order */
h2{font-weight:800;font-size:15px;color:var(--t2);margin:6px 2px 10px}
.list{list-style:none;margin:0;padding:0;position:relative}
.list li{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 16px;margin-bottom:8px;overflow:hidden;transition:background-color .35s var(--ease),border-color .35s,opacity .35s,transform .35s var(--ease)}
.list li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background-color .35s}
.list li .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:width .6s linear}
.list li.sub{margin-left:18px}
.list li.past{opacity:.72}
.list li.cur{background:var(--s2);border-color:rgba(242,170,30,.45)}
.list li.cur::before{background:var(--gold)}
.list .t{font-weight:700;line-height:1.25}
.list .t b{color:var(--gold);margin-right:8px;font-variant-numeric:tabular-nums}
.list .h{grid-column:1;color:var(--t2);font-size:13px;font-variant-numeric:tabular-nums}
.list .h em{font-style:normal;font-weight:800;color:var(--text)}
.list button{grid-row:1/3;grid-column:2;background:var(--s3);color:var(--text);font-weight:700;font-size:13px;padding:0 12px;min-height:46px;max-width:120px;line-height:1.15}
.list li.cur button{background:transparent;border:1px solid var(--line);color:var(--t2)}
.plan{display:block;width:100%;margin-top:18px;background:transparent;color:#ff9b7d;border:1px solid rgba(220,60,20,.5);font-weight:800}
.foot{color:var(--t3);font-size:13px;text-align:center;margin-top:16px}
.foot a{color:var(--t2)}

/* Feedback */
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;background:var(--cream);color:#151311;border-radius:12px;padding:14px 16px;font-weight:700;z-index:20;transform:translateY(160%);opacity:0;transition:transform .45s var(--spring),opacity .3s}
.toast.show{transform:none;opacity:1}
.toast.err{background:var(--red);color:#fff}
.busy{position:fixed;left:50%;top:76px;z-index:15;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;transform:translate(-50%,-140%);opacity:0;pointer-events:none;transition:transform .35s var(--spring),opacity .25s}
.busy::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:spin .8s linear infinite}
.busy.show{transform:translate(-50%,0);opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(0,0,0,0);pointer-events:none;visibility:hidden;transition:background-color .3s,visibility 0s .45s}
.modal.show{background:rgba(0,0,0,.6);pointer-events:auto;visibility:visible;transition:background-color .3s,visibility 0s}
.modal .box{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:520px;width:100%;transform:translateY(120%);transition:transform .45s var(--spring)}
.modal.show .box{transform:none}
.modal p{font-size:18px;font-weight:700;margin:0 0 18px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .yes{background:var(--gold);color:#151311;font-weight:800}
.modal .no{background:var(--s3);font-weight:700}

/* Small phones */
@media (max-width:400px){
  main{padding:12px}
  .now{gap:14px;padding:14px}
  .ring{width:108px;height:108px}
  .ring .big{font-size:28px}.ring .big.l6{font-size:22px}.ring .big.l7{font-size:18px}
  .now h1{font-size:19px}
  .btn-next{font-size:18px;min-height:68px}
  .adj button{font-size:16px}
  .list button{max-width:100px;font-size:12px;padding:0 8px}
}
@media (max-width:340px){
  .now{grid-template-columns:1fr;justify-items:center;text-align:center}
  .now .lbl{justify-content:center}
  .ring{width:120px;height:120px}
  .ring .big{font-size:30px}.ring .big.l6{font-size:24px}.ring .big.l7{font-size:20px}
  .top{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <div class="brand"><small>Régie MC</small>Gala LIONGATE</div>
  <div class="clock"><span id="clock">--:--:--</span><small id="sync"><i></i><span id="syncTxt">connexion…</span></small></div>
</header>

<main>
  <section class="pin hide" id="pinCard" aria-labelledby="pinLbl">
    <label id="pinLbl" for="pin">Code PIN de la régie</label>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
      <button id="pinOk">Valider</button>
    </div>
    <p id="pinMsg">Saisi une seule fois, il est mémorisé sur ce téléphone.</p>
  </section>

  <section class="now" id="nowCard">
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/><circle class="arc" id="arc" cx="60" cy="60" r="54"/></svg><div class="big num" id="nowBig">--:--</div></div>
    <div>
      <div class="lbl" id="nowLbl">Chargement…</div>
      <h1 id="nowTitle" aria-live="polite">&nbsp;</h1>
      <div class="sub" id="nowSub">&nbsp;</div>
    </div>
  </section>

  <section class="controls" aria-label="Commandes">
    <button class="btn-next" id="bNext">Étape suivante<span id="bNextSub">&nbsp;</span></button>
    <button class="btn-pause" id="bPause">Pause</button>
    <div class="adj">
      <button id="bM5" aria-label="Retirer cinq minutes à l'étape en cours">−5<small>min</small></button>
      <button id="bM1" aria-label="Retirer une minute à l'étape en cours">−1<small>min</small></button>
      <button id="bP1" aria-label="Ajouter une minute à l'étape en cours">+1<small>min</small></button>
      <button id="bP5" aria-label="Ajouter cinq minutes à l'étape en cours">+5<small>min</small></button>
    </div>
  </section>

  <h2>Déroulé</h2>
  <ul class="list" id="list"></ul>

  <button class="plan" id="bPlan">Revenir au plan</button>
  <p class="foot">Fin de soirée prévue <b id="endAt">--:--</b><br><a href="#" id="forget">Changer de code PIN</a></p>
</main>

<div class="busy" id="busy">Envoi</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTxt">
  <div class="box"><p id="modalTxt"></p><div class="row"><button class="no" id="mNo">Annuler</button><button class="yes" id="mYes">Confirmer</button></div></div>
</div>

    var pb = $("bPause"); pb.textContent = paused ? "Reprendre" : "Pause"; pb.classList.toggle("on", paused);
    pb.disabled = busy || (!paused && sc.phase !== "live");
    $("bNext").disabled = busy || !nx;
    ["bM5", "bM1", "bP1", "bP5"].forEach(function (b) { $(b).disabled = busy || sc.phase === "after"; });
    $("bPlan").disabled = busy;
    sc.units.forEach(function (x, i) {
      var row = rows[x.id]; if (!row) return;
      row.li.className = (x.id.indexOf(".") >= 0 ? "sub " : "") + (i === cur ? "cur" : (cur >= 0 && i < cur) || sc.phase === "after" ? "past" : "");
      var bar = row.li.querySelector(".bar"); if (!bar) { bar = document.createElement("i"); bar.className = "bar"; row.li.appendChild(bar); }
      bar.style.width = i === cur ? Math.min(100, Math.max(0, (t - x.start) / Math.max(1, x.end - x.start) * 100)) + "%" : "0%";
      var mins = Math.round(x.duration / 60000 * 10) / 10;
      var txt = hm(x.start) + " – " + hm(x.end) + ", " + String(mins).replace(".", ",") + " min";
      if (row.h.getAttribute("data-t") !== txt + (i === cur)) {
        row.h.setAttribute("data-t", txt + (i === cur));
        row.h.innerHTML = ""; var em = document.createElement("em"); em.textContent = hm(x.start); row.h.appendChild(em);
        row.h.appendChild(document.createTextNode(txt.slice(5) + (i === cur ? ", en cours" : "")));
      }
      row.li.querySelector("button").disabled = busy;
    });
  }

  function onState(s, t0, t1) {
    if (!s || s.ok === false) { if (s && s.error) toast(s.error, true); return; }
    if (typeof s.serverTime === "number") offset = s.serverTime - (t0 + t1) / 2;
    var rebuild = !state || JSON.stringify(state.units) !== JSON.stringify(s.units);
    state = s; ids = s.units.map(function (u) { return u.id; }); lastOk = Date.now();
    if (rebuild) buildList();
    if (!s.pinConfigured) { showPin(true); $("pinMsg").textContent = "Le code PIN n'est pas encore configuré par le propriétaire (Propriétés du script › MC_PIN)."; }
    else if (!pin) showPin(true);
    render();
  }

  function refresh() {
    if (polling || busy) return;
    polling = true; var t0 = Date.now();
    google.script.run
      .withSuccessHandler(function (s) { polling = false; onState(s, t0, Date.now()); })
      .withFailureHandler(function () { polling = false; render(); })
      .mcState();
  }

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  document.addEventListener("pointerdown", function (e) { var b = e.target.closest && e.target.closest("button"); if (b && !b.disabled) buzz(8); }, { passive: true });
  ["bM5", "bM1", "bP1", "bP5"].forEach(function (id) { $(id).addEventListener("click", function () { var b = $(id); b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }); });
  function setBusy(b) { busy = b; $("busy").classList.toggle("show", b); render(); }

  function act(action, arg) {
    if (busy) return;
    if (!pin) { showPin(true); toast("Entrez d'abord le code PIN.", true); $("pin").focus(); return; }
    setBusy(true); var t0 = Date.now();
    google.script.run
      .withSuccessHandler(function (r) {
        var t1 = Date.now(); setBusy(false);
        if (!r || !r.ok) {
          if (r && (r.badPin || r.noPin)) forgetPin();
          toast((r && r.error) || "Erreur inconnue.", true);
          if (r && r.state) onState(r.state, t0, t1);
          return;
        }
        onState(r.state, t0, t1); toast(r.message || "C'est fait."); buzz(15);
      })
      .withFailureHandler(function (e) { setBusy(false); toast("Connexion impossible : " + ((e && e.message) || e) + ". Réessayez.", true); })
      .mcAction(pin, action, arg === undefined ? null : arg, state ? state.rev : null);
  }

  $("pinOk").onclick = function () {
    var p = $("pin").value.trim(); if (!p) return;
    $("pinOk").disabled = true; $("pinMsg").textContent = "Vérification…";
    google.script.run
      .withSuccessHandler(function (r) {
        $("pinOk").disabled = false;
        if (r && r.ok) { savePin(p); showPin(false); toast("Code PIN enregistré sur ce téléphone."); }
        else { $("pinMsg").textContent = (r && r.error) || "Code PIN refusé."; $("pin").value = ""; var pc = $("pinCard"); pc.classList.remove("shake"); void pc.offsetWidth; pc.classList.add("shake"); buzz([40, 60, 40]); }
      })
      .withFailureHandler(function () { $("pinOk").disabled = false; $("pinMsg").textContent = "Connexion impossible, réessayez."; })
      .mcCheckPin(p);
  };
  $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("pinOk").click(); });
  $("forget").onclick = function (e) { e.preventDefault(); forgetPin(); $("pin").focus(); };

  $("bNext").onclick = function () { act("next", nextId); };
  $("bPause").onclick = function () { act(state && state.paused ? "resume" : "pause"); };
  $("bM5").onclick = function () {
    var sc = compute(), u = sc.current >= 0 ? sc.units[sc.current] : null;
    if (u && u.end - now() <= 5 * 60000 && nextId) ask("Il reste moins de 5 min sur cette étape : −5 min passe à l'étape suivante maintenant. Continuer ?", function () { act("next", nextId); });
    else if (u && u.end - now() <= 5 * 60000) ask("Il reste moins de 5 min : −5 min termine la soirée. Continuer ?", function () { act("adjust", -5); });
    else act("adjust", -5);
  };
  $("bM1").onclick = function () { act("adjust", -1); };
  $("bP1").onclick = function () { act("adjust", 1); };
  $("bP5").onclick = function () { act("adjust", 5); };
  $("bPlan").onclick = function () {
    ask("Revenir au plan ? Toutes les corrections d'horaires (« commence maintenant », pauses) seront effacées. Les durées sont conservées.", function () { act("plan"); });
  };

  if (pin) showPin(false);
  refresh();
  setInterval(refresh, 5000);
  setInterval(render, 500);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();
</script>
