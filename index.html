<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0c">
<title>Soirée de gala LIONGATE · 28 novembre 2026</title>
<meta name="description" content="Soirée de gala LIONGATE, 28 novembre 2026, Élites Offices, Douala. Le déroulé en direct.">
<link rel="icon" href="assets/logos/liongate-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Colours sampled from the logo files */
  --black:#0e0d0c; --black-2:#171513; --black-3:#211e1b;
  --cream:#f7ebc6; --paper:#f7f3ea; --white:#fbf9f4;
  --gold:#f2aa1e; --red:#dc3c14; --drc:#ba9654; --drc-ink:#8a6a2f;
  --text:#f4f0e6; --text-2:#bdb6a8; --text-3:#8f897d;
  --ink:#151311; --ink-2:#55504a;
  --line:rgba(247,235,198,.14); --line-ink:rgba(21,19,17,.12);
  --ease:cubic-bezier(.2,.7,.2,1); --fast:160ms; --mid:360ms; --slow:700ms;
  --sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --drc-serif:"Playfair Display",Georgia,serif; --drc-sans:Lato,system-ui,sans-serif;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:#000;color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
body.hide-cursor,body.hide-cursor *{cursor:none!important}
.drc-name{font-family:var(--drc-serif);font-weight:500;letter-spacing:0}

/* ===== Stage: 1920×1080 scaled to fit ===== */
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;transform-origin:center center;background:var(--black);overflow:hidden;display:flex;flex-direction:column}

/* ===== Header ===== */
#hud{position:relative;z-index:20;height:112px;flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:40px;padding:0 44px;background:var(--black);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:56px;width:auto}
.brand b{display:block;font-weight:800;font-size:24px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-size:15px;color:var(--text-2);margin-top:6px}
.now{display:flex;align-items:center;gap:22px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:4px;font-size:19px;font-weight:700;white-space:nowrap;border:1px solid var(--line);color:var(--text)}
.badge .dot{width:10px;height:10px;border-radius:50%;background:var(--text-3)}
.badge.live{background:var(--red);border-color:var(--red);color:#fff}
.badge.live .dot{background:#fff}
.badge.hold{border-color:var(--gold);color:var(--gold)}
.badge.hold .dot{background:var(--gold)}
.stepinfo{min-width:0;flex:1}
.stepinfo .l1{display:flex;align-items:baseline;gap:14px;font-size:16px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.stepinfo .l1 #stepWho{min-width:0;overflow:hidden;text-overflow:ellipsis}
.stepinfo .l1 b{color:var(--gold);font-weight:700}
.stepinfo .ttl{font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1.12;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
body.s-before #stepNo,body.s-before .bar,body.s-after .stepinfo,body.s-before .endin{display:none}
.bar{height:4px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width 1s linear}
.right{display:flex;align-items:center;gap:28px}
.timer{text-align:right;line-height:1}
.timer b{display:block;font-size:48px;font-weight:700;letter-spacing:-.02em}
.timer span{display:block;font-size:15px;color:var(--text-2);margin-top:8px}
.timer.over b{color:var(--gold)}
.endin{font-size:15px;color:var(--text-2);text-align:right;line-height:1.35;white-space:nowrap}
.endin b{display:block;color:var(--text);font-size:22px;font-weight:700}
.tools{display:flex;gap:8px}
.tbtn{height:44px;min-width:44px;padding:0 14px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;border:1px solid var(--line);color:var(--text);transition:background var(--fast),border-color var(--fast)}
.tbtn:hover{background:var(--black-3);border-color:rgba(247,235,198,.3)}
.tbtn:active{transform:translateY(1px)}
.tbtn svg{width:20px;height:20px}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{height:42px;padding:0 13px;font-size:14px;font-weight:700;color:var(--text-2)}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.sound-cta{position:absolute;z-index:25;right:44px;bottom:44px;display:none;align-items:center;gap:12px;height:60px;padding:0 24px;border-radius:4px;background:var(--cream);color:var(--ink);font-size:19px;font-weight:700}
.sound-cta svg{width:24px;height:24px}
body.needs-sound .sound-cta{display:inline-flex}
body.hide-cursor .tools{opacity:0;transition:opacity var(--mid)}

/* ===== Scenes ===== */
#scene{position:absolute;inset:0;z-index:1}
#scene > .layer{position:absolute;inset:0;animation:fadein var(--slow) var(--ease)}
#scene > .layer.talk{top:112px}
body.s-before #scene > .layer,body.s-open #scene > .layer,body.s-after #scene > .layer{top:112px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bgvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.28)}

/* Cover */
.cover-foot{position:absolute;left:44px;bottom:40px}
.ghost{height:50px;padding:0 20px;border-radius:4px;display:inline-flex;align-items:center;font-size:17px;font-weight:600;background:rgba(14,13,12,.82);border:1px solid var(--line);color:var(--text)}
.ghost:hover{background:var(--black)}

/* Open step: title in a solid band at the foot of the picture */
.open-copy{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:48px;padding:44px 88px 52px;background:var(--black);border-top:1px solid var(--line)}
.open-copy h1{font-weight:800;font-size:80px;line-height:1;letter-spacing:-.03em;max-width:16ch;animation:rise var(--slow) var(--ease) both}
.open-copy p{font-size:26px;color:var(--text-2);margin-top:16px;max-width:42ch}
.upnext{flex:none;min-width:420px;padding:22px 26px;border-left:2px solid var(--gold);background:var(--black-2)}
.upnext small{display:block;font-size:17px;font-weight:700;color:var(--gold)}
.upnext b{display:block;font-weight:700;font-size:32px;line-height:1.15;margin-top:8px;letter-spacing:-.01em}
.upnext span{display:block;font-size:19px;color:var(--text-2);margin-top:8px}
.ambient{position:absolute;inset:0;background:var(--black)}
.ambient img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;opacity:0;transition:opacity 1.2s var(--ease)}
.ambient img.on{opacity:1}

/* After */
.after{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(14,13,12,.86)}
.after h1{font-weight:800;font-size:110px;line-height:1;letter-spacing:-.03em}
.after p{font-size:26px;color:var(--text-2);margin-top:20px}
.after .duo{margin:56px auto 0}

/* ===== Presenter step ===== */
.talk{position:absolute;left:0;right:0;top:112px;bottom:0;display:grid;grid-template-columns:560px 1fr;gap:32px;padding:32px 40px 32px;background:var(--black)}
.side{display:flex;flex-direction:column;gap:20px;min-height:0}
.pcard{padding:28px;border:1px solid var(--line);border-top:2px solid var(--gold);background:var(--black-2);animation:rise var(--slow) var(--ease) both}
.pcard.drc{border-top-color:var(--drc)}
.pcard .who{display:flex;align-items:center;gap:22px}
.medal{flex:none;width:104px;height:104px;border-radius:var(--r);display:grid;place-items:center;font-weight:800;font-size:40px;letter-spacing:.02em;color:var(--ink);background:var(--cream)}
.medal img{width:100%;height:100%;border-radius:var(--r);object-fit:cover}
.pcard .name{font-weight:800;font-size:40px;line-height:1.06;letter-spacing:-.02em}
.pcard .role{font-size:22px;color:var(--text-2);margin-top:10px;line-height:1.35}
.org{display:block;margin-top:12px;font-size:19px;font-weight:700;color:var(--gold)}
.org.drc{color:var(--drc);font-size:22px}
.pcard .topic{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:17px;color:var(--text-3)}
.pcard .topic b{display:block;color:var(--text);font-weight:700;font-size:24px;margin-top:4px;line-height:1.2}
.runlist{list-style:none;flex:1;min-height:0;overflow:hidden;border-top:1px solid var(--line)}
.runlist li{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;padding:11px 14px;font-size:20px;border-bottom:1px solid var(--line);border-left:2px solid transparent}
.runlist li .t{color:var(--text-2)}
.runlist li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runlist li .s{font-size:15px;font-weight:700;color:var(--gold)}
.runlist li.past .n,.runlist li.past .t{color:var(--text-3)}
.runlist li.cur{background:var(--black-2);border-left-color:var(--gold)}
.runlist li.cur .n{color:#fff;font-weight:700}
.runlist li.sub .n{padding-left:20px}

.main{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.frame{position:relative;flex:1;border-radius:var(--r);overflow:hidden;background:var(--black-2)}
.slidebox{position:absolute;left:0;top:0;width:1264px;height:856px;transform-origin:0 0}
.slide{position:absolute;inset:0;overflow:hidden;animation:fadein var(--mid) var(--ease) both}
.slide.leave{animation:fadeout var(--mid) var(--ease) both}
@keyframes fadeout{to{opacity:0}}
.foot{flex:none;display:flex;align-items:center;gap:20px;height:36px;color:var(--text-2);font-size:18px}
.secbar{flex:1;max-width:420px;height:3px;background:var(--line);overflow:hidden}
.secbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.dots{display:none}

/* ---- Sections (designed at 1264×856) ---- */
.s-logos{background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;text-align:center;padding:56px 72px;overflow:hidden}
.s-logos p{font-size:28px;line-height:1.4;color:var(--text-2);max-width:48ch;margin-top:-24px;text-wrap:balance}
.duo{display:flex;align-items:center;gap:72px}
.duo img{height:300px;width:auto;object-fit:contain;animation:rise 900ms var(--ease) both}
.duo img.drc{height:220px;animation-delay:.2s}
.duo .sep{width:1px;height:240px;background:var(--line)}
.s-logos h2{font-weight:700;font-size:46px;line-height:1.12;letter-spacing:-.02em;max-width:22ch;animation:rise 900ms var(--ease) .35s both}

.s-alt{display:grid;place-items:center;background:var(--paper);animation:altbg 12s ease-in-out infinite}
@keyframes altbg{0%,40%{background:var(--paper)}50%,90%{background:var(--black)}100%{background:var(--paper)}}
.s-alt .logo{position:relative;width:640px;height:436px}
.s-alt .logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.s-alt .logo .k{animation:altk 12s ease-in-out infinite}
.s-alt .logo .c{opacity:0;animation:altc 12s ease-in-out infinite}
@keyframes altk{0%,40%{opacity:1}48%,92%{opacity:0}100%{opacity:1}}
@keyframes altc{0%,44%{opacity:0}52%,88%{opacity:1}96%,100%{opacity:0}}
.s-alt .cap{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:24px;font-weight:700;color:var(--ink);animation:altcap 12s ease-in-out infinite}
@keyframes altcap{0%,40%{color:var(--ink)}50%,90%{color:var(--text)}100%{color:var(--ink)}}

.s-title{background:var(--black);display:flex;flex-direction:column;justify-content:center;padding:88px;overflow:hidden}
.s-title small{font-size:22px;font-weight:700;color:var(--gold)}
.s-title h2{font-weight:800;font-size:72px;line-height:1.02;letter-spacing:-.03em;margin-top:20px;max-width:16ch}
.s-title p{font-size:28px;color:var(--text-2);margin-top:26px;max-width:44ch;line-height:1.4}

.s-ti{background:var(--paper);color:var(--ink);display:grid;grid-template-columns:1fr 1fr}
.s-ti .txt{padding:64px 56px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.s-ti h2{font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.025em}
.s-ti p{font-size:28px;line-height:1.42;color:var(--ink-2);margin-top:24px}
.s-ti .img{position:relative;background:var(--black)}
.s-ti .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.steps{list-style:none;counter-reset:s;display:grid}
.s-ti .img .steps{position:absolute;inset:0;padding:72px 64px;align-content:center}
.steps li{counter-increment:s;display:flex;align-items:baseline;gap:22px;padding:22px 0;border-bottom:1px solid var(--line);font-size:30px;font-weight:600;color:var(--text);animation:rise 700ms var(--ease) both}
.steps li:first-child{border-top:1px solid var(--line)}
.steps li::before{content:counter(s,decimal-leading-zero);flex:none;font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.s-ti .txt .steps{margin-top:30px}
.s-ti .txt .steps li{color:var(--ink);font-size:24px;border-color:var(--line-ink);padding:14px 0}
.s-ti .txt .steps li::before{color:var(--ink-2)}

.s-car{background:var(--black)}
.s-car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s var(--ease)}
.s-car img.on{opacity:1}
.s-car img.contain{object-fit:contain;padding:64px;background:var(--white)}
.s-car .cap{position:absolute;left:0;bottom:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:0 32px 28px}
.s-car.fit .cap{top:28px;bottom:auto;align-items:flex-start}
.s-car .cap b{font-weight:700;font-size:32px;line-height:1.15;padding:14px 20px;background:var(--black);color:var(--text);max-width:24ch;border-radius:4px}
.s-car .cap span{font-size:20px;font-weight:700;padding:8px 14px;background:var(--black);color:var(--text);border-radius:4px}

/* ---- Dorothy Roffat sections: Playfair Display + Lato ---- */
.slide.drc{font-family:var(--drc-sans)}
.s-prod{background:var(--white);color:var(--ink);display:grid;grid-template-columns:480px 1fr}
.s-prod .pv{position:relative;background:var(--paper);border-right:1px solid var(--line-ink)}
.s-prod .pv img{position:absolute;left:50%;top:50%;width:80%;height:76%;object-fit:contain;transform:translate(-50%,-50%);opacity:0;transition:opacity .8s var(--ease)}
.s-prod .pv img.on{opacity:1}
.s-prod .pd{padding:56px 52px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.s-prod small{font-size:22px;font-weight:700;color:var(--drc-ink)}
.s-prod h2{font-family:var(--drc-serif);font-weight:500;font-size:52px;line-height:1.06;margin-top:16px}
.s-prod p{font-size:28px;line-height:1.4;color:var(--ink-2);margin-top:20px}
.s-prod ul{list-style:none;margin-top:28px;border-top:1px solid var(--line-ink)}
.s-prod li{padding:10px 0;border-bottom:1px solid var(--line-ink);font-size:24px;color:var(--ink)}
.s-prod .swap{animation:rise 600ms var(--ease) both}
.s-prod .pdots{margin-top:28px;font-size:20px;color:var(--ink-2)}
.s-prod .pdots i{display:none}

.s-tl{background:var(--white);color:var(--ink);padding:80px 72px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.s-tl h2{font-family:var(--drc-serif);font-weight:500;font-size:46px;line-height:1.12;max-width:22ch}
.s-tl .row{display:grid;grid-template-columns:repeat(4,1fr);margin-top:80px;border-top:2px solid var(--drc)}
.s-tl .row div{position:relative;padding:34px 24px 0 0;animation:rise 700ms var(--ease) both}
.s-tl b{display:block;font-family:var(--drc-serif);font-weight:500;font-size:62px;color:var(--drc-ink);line-height:1}
.s-tl span{display:block;margin-top:14px;font-size:28px;color:var(--ink-2)}

.s-quote{background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px;overflow:hidden}
.s-quote img{height:120px;width:auto;margin-bottom:48px}
.s-quote blockquote{font-family:var(--drc-serif);font-style:italic;font-weight:400;font-size:84px;line-height:1.05;color:var(--cream);max-width:16ch}
.s-quote p{font-family:var(--drc-sans);font-size:26px;max-width:40ch;line-height:1.4;color:var(--drc);margin-top:36px}

/* Product showcase: the current product in front, the previous and next at the sides */
.s-show{background:#f7f6f3;color:var(--ink);transition:background-color .9s var(--ease)}
.s-show .head{position:absolute;left:56px;right:56px;top:44px;height:150px;overflow:hidden}
.s-show .head h2{font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.02em}
.slide.drc .s-show .head h2{font-family:var(--drc-serif);font-weight:500;letter-spacing:0}
.s-show .head p{font-size:28px;line-height:1.35;color:var(--ink-2);margin-top:10px;max-width:60ch;text-wrap:balance}
.s-show .stage{position:absolute;left:0;right:0;top:200px;bottom:70px}
.s-show .card{position:absolute;left:50%;top:50%;width:40%;height:100%;transform:translate(-50%,-50%) scale(.5);opacity:0;transition:transform .9s var(--ease),opacity .9s var(--ease)}
.s-show .card.white{mix-blend-mode:multiply}
.s-show .card.wide{width:60%}
.s-show .card.wide.is-l{transform:translate(-126%,-50%) scale(.42)}
.s-show .card.wide.is-r{transform:translate(26%,-50%) scale(.42)}
body.flow .s-show .card.wide{width:80%}
.s-show .card img{width:100%;height:100%;object-fit:contain;}
.s-show .card.photo img{-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent),linear-gradient(180deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent),linear-gradient(180deg,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.s-show .card.is-c{transform:translate(-50%,-50%) scale(1);opacity:1;z-index:3}
.s-show .card.is-l{transform:translate(-138%,-50%) scale(.5);opacity:.5;z-index:2}
.s-show .card.is-r{transform:translate(38%,-50%) scale(.5);opacity:.5;z-index:2}
.s-show .card.is-l2{transform:translate(-170%,-50%) scale(.35);opacity:0}
.s-show .card.is-r2{transform:translate(70%,-50%) scale(.35);opacity:0}
.s-show .name{position:absolute;left:56px;right:56px;bottom:22px;display:flex;justify-content:space-between;align-items:baseline;font-size:22px;color:var(--ink-2)}
.s-show .name b{font-size:32px;color:var(--ink)}
.slide.drc .s-show .name b{font-family:var(--drc-serif);font-weight:500;font-size:32px;color:var(--ink)}
body.flow .s-show .head{left:40px;right:40px;top:36px;height:190px}
body.flow .s-show .stage{top:240px;bottom:80px}
body.flow .s-show .card{width:62%}
body.flow .s-show .card.is-l{transform:translate(-112%,-50%) scale(.5)}
body.flow .s-show .card.is-r{transform:translate(12%,-50%) scale(.5)}

.s-spot{background:#000}
.s-spot video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.s-spot .vlabel{position:absolute;left:24px;top:24px;padding:8px 14px;background:var(--black);border-radius:4px;font-size:18px;font-weight:600;animation:fadeout 1s ease 4s forwards}
.s-spot .vctl{position:absolute;right:24px;bottom:24px}
.s-spot .endcard{position:absolute;inset:0;display:none;place-items:center;background:var(--black)}
.s-spot.done .endcard{display:grid}
.s-spot .endcard img{height:260px;width:auto}

/* ===== Programme drawer ===== */
#drawer{position:absolute;inset:0;z-index:40;display:none;background:rgba(0,0,0,.6)}
#drawer.open{display:block}
#drawer .panel{position:absolute;right:0;top:0;bottom:0;width:620px;background:var(--black);border-left:1px solid var(--line);padding:40px;overflow:auto}
#drawer h2{font-weight:800;font-size:40px;letter-spacing:-.02em}
#drawer .meta{color:var(--text-2);margin-top:8px;font-size:17px}
#drawer ol{list-style:none;margin-top:28px;border-top:1px solid var(--line)}
#drawer li{display:grid;grid-template-columns:80px 1fr;gap:14px;padding:16px 4px 16px 12px;border-bottom:1px solid var(--line);border-left:2px solid transparent;font-size:19px}
#drawer li .t{color:var(--text-2)}
#drawer li small{display:block;color:var(--text-2);font-size:16px;margin-top:3px}
#drawer li.past,#drawer li.past .t{color:var(--text-3)}
#drawer li.cur{background:var(--black-2);border-left-color:var(--gold)}
#drawer li.sub{padding-left:32px}
#drawer .close{position:absolute;right:28px;top:28px}
#drawer .foot-note{margin-top:28px;font-size:15px;color:var(--text-2)}

/* Spot: full stage, 16:9 canvas */
body.spotfull .talk{grid-template-columns:1fr}
body.spotfull .side{display:none}
body.spotfull .slidebox{width:1600px;height:900px}

/* ===== Phones and portrait screens (no scaling, the page scrolls) ===== */
body.flow{overflow:auto}
body.flow #viewport{position:static;display:block}
body.flow #stage{width:100%;height:auto;min-height:100svh;transform:none!important}
body.flow #hud{position:sticky;top:0;height:auto;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "now now" "timer timer";gap:10px 12px;padding:10px 16px 12px;padding-top:max(10px,env(safe-area-inset-top))}
body.flow .brand{grid-area:brand;gap:10px;min-width:0;overflow:hidden}
body.flow .right{display:contents}
body.flow .tools{grid-area:tools;gap:6px}
body.flow .now{grid-area:now;gap:12px}
body.flow .timer{grid-area:timer;display:flex;align-items:baseline;gap:10px;text-align:left}
body.flow .timer span{margin-top:0;font-size:13px}
body.flow .timer b{font-size:28px}
body.flow .brand img{height:34px}
body.flow .brand b{font-size:16px}
body.flow .brand small{display:none}
@media (max-width:420px){body.flow .brand b{display:none}}
body.flow .stepinfo .ttl{font-size:20px;-webkit-line-clamp:3}
body.flow .stepinfo .l1{font-size:13px;flex-wrap:wrap;white-space:normal;gap:8px}
body.flow .badge{height:30px;padding:0 10px;font-size:13px}
body.flow .badge.live{background:#c8330f;border-color:#c8330f}
body.flow .endin{display:none}
body.flow .tbtn{height:40px;min-width:40px;padding:0 10px}
body.flow .tbtn .lbl{display:none}
body.flow #fsBtn{display:none}
body.flow .lang button{height:38px;padding:0 10px}
body.flow #scene{position:relative;inset:auto}
body.flow #scene > .layer{position:relative;inset:auto;top:auto}
body.flow .cover,body.flow .openstep,body.flow .afterstep{height:calc(100svh - 130px);min-height:440px;position:relative}
body.flow .open-copy{padding:20px 16px 22px;flex-direction:column;align-items:stretch;gap:16px}
body.flow .open-copy h1{font-size:40px}
body.flow .open-copy p{font-size:17px}
body.flow .upnext{min-width:0;padding:14px 16px}
body.flow .upnext b{font-size:22px}
body.flow .upnext small,body.flow .upnext span{font-size:15px}
body.flow .cover-foot{left:16px;bottom:16px}
body.flow .after h1{font-size:52px}
body.flow .after p{font-size:17px;padding:0 16px}
body.flow .after .duo{gap:24px}
body.flow .after .duo img{height:110px}
body.flow .after .duo img.drc{height:80px}
body.flow .after .duo .sep{height:90px}
body.flow .talk{position:relative;top:auto;display:flex;flex-direction:column;gap:16px;padding:16px}
body.flow .side{display:contents}
body.flow .pcard{order:1;padding:16px}
body.flow .medal{width:60px;height:60px;font-size:24px}
body.flow .pcard .name{font-size:24px}
body.flow .pcard .role{font-size:15px}
body.flow .org{font-size:14px}
body.flow .pcard .topic{font-size:14px}
body.flow .pcard .topic b{font-size:18px}
body.flow .main{order:2}
body.flow .frame{flex:none}
body.flow .foot{font-size:14px}
body.flow .runlist{order:3;overflow:visible}
body.flow .runlist li{grid-template-columns:54px 1fr auto;font-size:15px;padding:10px 10px}
body.flow .runlist li .s{font-size:13px}
body.flow #drawer .panel{width:100%;padding:24px 16px}
body.flow .sound-cta{position:fixed;right:16px;bottom:16px;height:50px;font-size:16px}
/* Portrait slide canvas with stacked layouts */
body.flow .slidebox{width:720px;height:960px}
body.flow .frame{aspect-ratio:720/960}
body.flow.spotfull .slidebox{width:1600px;height:900px}
body.flow.spotfull .frame{aspect-ratio:16/9}
body.flow .s-logos{gap:40px;padding:40px}
body.flow .duo{flex-direction:column;gap:36px}
body.flow .duo .sep{width:240px;height:1px}
body.flow .s-logos .duo img{height:250px}
body.flow .s-logos .duo img.drc{height:170px}
body.flow .s-alt .logo{width:600px;height:410px}
body.flow .s-title{padding:56px}
body.flow .s-ti{grid-template-columns:1fr;grid-template-rows:auto 1fr}
body.flow .s-ti .txt{padding:56px 48px 32px}
body.flow .s-ti .img .steps{padding:24px 48px;align-content:start}
body.flow .s-prod{grid-template-columns:1fr;grid-template-rows:330px 1fr}
body.flow .s-prod .pv{border-right:0;border-bottom:1px solid var(--line-ink)}
body.flow .s-prod .pd{padding:32px 44px;justify-content:flex-start}
body.flow .s-prod h2{font-size:52px}
body.flow .s-prod p{font-size:30px;margin-top:14px}
body.flow .s-prod ul{margin-top:18px}
body.flow .s-prod li{font-size:24px;padding:8px 0}
body.flow .s-prod .pdots{margin-top:16px}
body.flow .s-tl{padding:56px 48px}
body.flow .s-tl .row{grid-template-columns:1fr 1fr;row-gap:48px;margin-top:56px}
body.flow .s-quote blockquote{font-size:80px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .s-alt{background:var(--paper)}
  .s-alt .logo .k{opacity:1}
  .s-alt .logo .c{opacity:0}
  .s-alt .cap{color:var(--ink)}
  .s-spot .vlabel{display:none}
}

<body class="s-before">
<div id="viewport">
  <div id="stage">
    <header id="hud">
      <div class="brand"><img src="assets/logos/liongate-emblem.png" alt=""><div><b>LIONGATE</b><small id="brandSub"></small></div></div>
      <div class="now">
        <span class="badge num" id="badge"><span class="dot"></span><span id="badgeText"></span></span>
        <div class="stepinfo">
          <div class="l1"><b id="stepNo"></b><span id="stepTime" class="num"></span><span id="stepWho"></span></div>
          <div class="ttl" id="stepTitle"></div>
          <div class="bar" id="bar"><i></i></div>
        </div>
      </div>
      <div class="right">
        <div class="timer num" id="timer" aria-live="off"><b id="timerVal">--:--</b><span id="timerLbl"></span></div>
        <div class="endin num" id="endin"></div>
        <div class="tools">
          <button class="tbtn" id="progBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="lbl" id="progLbl">Programme</span></button>
          <button class="tbtn" id="muteBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="muteWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg></button>
          <div class="lang" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
          <button class="tbtn" id="fsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl" id="fsLbl">Plein écran</span></button>
        </div>
      </div>
    </header>
    <main id="scene" aria-live="polite"></main>
    <button class="sound-cta" id="soundCta" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg><span id="soundLbl">Activer le son</span></button>
    <div id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="panel">
      <button class="tbtn close" id="drawerClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <h2 id="drawerTitle"></h2><p class="meta" id="drawerMeta"></p><ol id="drawerList"></ol><p class="foot-note" id="drawerNote"></p>
    </div></div>
  </div>
</div>

<script src="content.js"></script>
<script src="engine.js"></script>
<script>
(() => {
  "use strict";
  const G = window.GALA, E = window.GalaEngine;
  const qs = new URLSearchParams(location.search);
  const SCREEN = qs.has("ecran") || qs.has("screen");
  if (qs.get("live") && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) G.liveUrl = qs.get("live"); // local testing only
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  const UI = {
    fr: { soon: "Le programme commence dans", live: "En direct", hold: "En pause", before: "Bientôt", after: "Terminé", step: "Étape", left: "restant", over: "dépassement", paused: "en pause", endIn: "Fin de soirée dans", end: "Fin prévue", programme: "Programme", next: "À suivre", in: "dans", now: "En cours", done: "Merci d'avoir été là", doneLine: "Au plaisir de vous retrouver.", sound: "Activer le son", soundOff: "Couper le son", full: "Plein écran", exitFull: "Quitter", close: "Fermer", note: "Horaires mis à jour en direct par la régie.", noteOffline: "Horaires du programme prévu.", topic: "Intervention", section: "Section", spotOf: "Spot", startsAt: "à", h: "h" },
    en: { soon: "The programme starts in", live: "Live", hold: "On hold", before: "Soon", after: "Ended", step: "Step", left: "left", over: "overtime", paused: "on hold", endIn: "Evening ends in", end: "Planned end", programme: "Programme", next: "Up next", in: "in", now: "Now", done: "Thank you for joining us", doneLine: "We look forward to seeing you again.", sound: "Turn sound on", soundOff: "Mute", full: "Full screen", exitFull: "Exit", close: "Close", note: "Times updated live by the stage manager.", noteOffline: "Times from the planned programme.", topic: "Session", section: "Section", spotOf: "Spot", startsAt: "at", h: "h" },
  };
  let lang = store.get("gala-lang") === "en" ? "en" : "fr";
  const L = (o) => (o && typeof o === "object" && !Array.isArray(o)) ? (o[lang] ?? o.fr ?? "") : (o ?? "");
  const U = () => UI[lang];

  // ---------- Units (steps + sub-steps flattened) ----------
  const units = [];
  G.steps.forEach((s, i) => {
    units.push({ ...s, no: i + 1, sub: false, parent: null });
    (s.substeps || []).forEach((ss, k) => units.push({ kind: "talk", ...ss, no: i + 1, subNo: k + 2, sub: true, parent: s }));
  });
  const ids = units.map(u => u.id);
  const planStart = Date.parse(G.event.start);

  // ---------- Time: server offset + optional simulation (?t=HH:MM or ISO) ----------
  let serverOffset = 0, simOffset = 0;
  if (qs.get("t")) {
    const t = qs.get("t"), m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(t), d = m ? Date.parse(G.event.start.slice(0, 11) + m[1].padStart(2, "0") + ":" + m[2] + ":" + (m[3] || "00") + G.event.start.slice(19)) : Date.parse(t);
    if (isFinite(d)) simOffset = d - Date.now();
  }
  const now = () => Date.now() + serverOffset + simOffset;

  // ---------- Live state from Apps Script (with last-good cache) ----------
  let live = {}, liveOk = false;
  // Rehearsal leftovers (anchors/pauses stamped long before the event) must never push the gala into the past
  function dropStale(x) {
    if (!x) return x; const min = planStart - 12 * 36e5;
    Object.keys(x.anchors || {}).forEach(k => { if (x.anchors[k] < min) delete x.anchors[k]; });
    if (x.paused && x.paused.since < min) x.paused = null;
    if (x.start && x.start < min) x.start = null;
    return x;
  }
  try { const c = JSON.parse(store.get("gala-live") || "null"); if (c && G.liveUrl && c.url === G.liveUrl && c.at > Date.now() - 6 * 36e5) { live = dropStale(E.cleanLive(c.live, ids)) || {}; serverOffset = c.offset || 0; } } catch (e) {}
  async function poll() {
    if (!G.liveUrl) return;
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 8000);
    try {
      const t0 = Date.now();
      const r = await fetch(G.liveUrl + (G.liveUrl.includes("?") ? "&" : "?") + "format=json&_=" + t0, { cache: "no-store", signal: ctl && ctl.signal });
      const j = await r.json(), t1 = Date.now();
      if (j && j.ok) {
        const clean = dropStale(E.cleanLive(j, ids));
        if (clean) {
          live = clean; liveOk = true;
          if (typeof j.serverTime === "number") serverOffset = j.serverTime - (t0 + t1) / 2;
          store.set("gala-live", JSON.stringify({ live: j, offset: serverOffset, at: Date.now(), url: G.liveUrl }));
        }
      }
    } catch (e) { liveOk = false; } finally { clearTimeout(to); }
  }

  function schedule(t = now()) {
    const plan = { start: (live && live.start) || planStart, units: units.map(u => ({ id: u.id, duration: u.duration })) };
    return E.computeSchedule(plan, live, t);
  }

  // ---------- Formatting ----------
  const pad = (n) => String(n).padStart(2, "0");
  const hm = (ms) => { const d = new Date(ms + 36e5); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); }; // Douala = UTC+1
  const dur = (ms) => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`; };
  const hours = (ms) => { const m = Math.max(0, Math.round(ms / 6e4)); return m >= 60 ? `${Math.floor(m / 60)} h ${pad(m % 60)}` : `${m} min`; };
  const initials = (n) => n.replace(/^(M\.\s+le|M\.|Mme|Mr|Dr|Pr)\s+/i, "").split(/\s+/).filter(w => w.length > 1 && !/^(de|du|la|le|des)$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const logoSrc = (k) => G.logos[k] || k;
  // The Dorothy Roffat brand name is always set in its own face (Playfair Display)
  const brandify = (txt) => esc(txt).replace(/Dorothy Roffat Cosmetics/g, '<span class="drc-name">Dorothy Roffat Cosmetics</span>');
  const isDrc = (u) => !!u && (u.brand === "drc" || (u.parent && u.parent.brand === "drc"));
  const imgTag = (src, alt, cls, extra) => src ? `<img src="${esc(src)}" alt="${esc(alt || "")}"${cls ? ` class="${cls}"` : ""}${extra || ""} onerror="this.style.visibility='hidden'">` : "";

  // ---------- Sound ----------
  let soundOn = false; // browsers require a user gesture on every load before sound can play
  function applySound() {
    document.querySelectorAll("video").forEach(v => { v.muted = !soundOn; });
    $("#muteBtn").setAttribute("aria-pressed", String(soundOn));
    $("#muteBtn").setAttribute("aria-label", soundOn ? U().soundOff : U().sound);
    $("#muteWave").style.opacity = soundOn ? 1 : .25;
    const anyVideo = !!document.querySelector("#scene video");
    document.body.classList.toggle("needs-sound", anyVideo && !soundOn);
  }
  function setSound(on) { soundOn = on; applySound(); document.querySelectorAll("#scene video").forEach(v => { if (v.paused && !v.ended) v.play().catch(() => {}); }); }
  $("#soundCta").addEventListener("click", () => setSound(true));
  $("#muteBtn").addEventListener("click", () => setSound(!soundOn));

  function playVideo(v) {
    v.muted = !soundOn; v.playsInline = true;
    const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; soundOn = false; v.play().catch(() => {}); applySound(); });
  }

  // ---------- Scene rendering ----------
  let sceneKey = "", secKey = "", manual = { id: null, k: null, at: 0 }, slideState = null;

  function teaserVideo() {
    const list = (G.media.teasers || []).filter(Boolean);
    if (!list.length) return "";
    return `<video class="bgvideo" data-teaser="0" src="${esc(list[0])}" poster="${esc(G.media.teaserPoster || "")}" muted playsinline autoplay preload="auto"></video>`;
  }
  function wireTeaser(root) {
    const v = root.querySelector("video[data-teaser]"); if (!v) return;
    const list = G.media.teasers.filter(Boolean);
    v.loop = list.length === 1;
    v.addEventListener("ended", () => { const k = (+v.dataset.teaser + 1) % list.length; v.dataset.teaser = k; v.src = list[k]; playVideo(v); });
    playVideo(v);
  }

  function renderScene(sch) {
    const sc = $("#scene"), cur = sch.current >= 0 ? units[sch.current] : null;
    const phase = sch.phase === "live" && cur ? (cur.kind === "open" ? "open" : "talk") : sch.phase;
    document.body.className = document.body.className.replace(/\bs-\w+/g, "").trim() + " s-" + phase;
    slideState = null; document.body.classList.remove("spotfull");
    let html = "";
    if (phase === "before") {
      html = `<div class="layer cover">${teaserVideo()}<div class="cover-foot"><button class="ghost" type="button" data-open-prog>${esc(U().programme)}</button></div></div>`;
    } else if (phase === "open") {
      const nx = sch.next >= 0 ? units[sch.next] : null;
      const bg = cur.scene === "teaser" ? teaserVideo() : `<div class="ambient">${(cur.images || []).map((s, k) => imgTag(s, "", k === 0 ? "on" : "")).join("")}</div>`;
      html = `<div class="layer openstep">${bg}<div class="shade"></div><div class="open-copy"><div><h1>${esc(L(cur.title))}</h1>${cur.line ? `<p>${esc(L(cur.line))}</p>` : ""}</div>${nx ? `<div class="upnext"><small>${esc(U().next)}</small><b>${esc(L(nx.title))}</b><span class="num" data-upnext></span></div>` : ""}</div></div>`;
    } else if (phase === "after") {
      html = `<div class="layer afterstep">${teaserVideo()}<div class="after"><div class="in"><h1>${esc(U().done)}</h1><p>${esc(U().doneLine)}</p><div class="duo">${imgTag(logoSrc("liongate"), "LIONGATE")}<span class="sep"></span>${imgTag(logoSrc("drc"), "Dorothy Roffat Cosmetics", "drc")}</div></div></div></div>`;
    } else {
      html = `<div class="layer talk"><aside class="side">${presenterCard(cur)}<ol class="runlist" id="runlist"></ol></aside><div class="main"><div class="frame" id="frame"><div class="slidebox" id="slidebox"></div></div><div class="foot"><span id="secLabel" class="num"></span><span class="secbar"><i id="secBar"></i></span><span class="dots" id="dots"></span></div></div></div>`;
    }
    sc.innerHTML = html;
    wireTeaser(sc);
    sc.querySelectorAll("[data-open-prog]").forEach(b => b.addEventListener("click", openDrawer));
    if (phase === "talk") { fitSlide(); secKey = ""; renderRunlist(sch); }
    applySound();
  }

  function presenterCard(u) {
    const p = u.presenter || (u.parent && u.parent.presenter);
    if (!p) return "";
    const mono = p.monogram === undefined ? initials(p.name) : p.monogram;
    const medal = !mono && !p.photo ? "" : p.photo ? `<span class="medal"><img src="${esc(p.photo)}" alt="" data-m="${esc(mono)}" onerror="this.parentNode.textContent=this.dataset.m"></span>` : `<span class="medal" aria-hidden="true">${esc(mono)}</span>`;
    const topic = u.sub ? `${L(u.parent.title)} · ${L(u.title)}` : L(u.title);
    const drc = /Dorothy Roffat/.test(p.org || "");
    return `<section class="pcard${drc ? " drc" : ""}" aria-label="${esc(p.name)}"><div class="who">${medal}<div><div class="name">${esc(p.name)}</div>${L(p.role) ? `<div class="role">${esc(L(p.role))}</div>` : ""}${p.org ? `<span class="org${drc ? " drc" : ""}">${brandify(p.org)}</span>` : ""}</div></div><div class="topic">${esc(U().topic)}<b>${esc(topic)}</b></div></section>`;
  }

  function renderRunlist(sch) {
    const el = $("#runlist"); if (!el) return;
    el.innerHTML = sch.units.map((s, i) => { const u = units[i]; const st = i < sch.current ? "past" : i === sch.current ? "cur" : ""; return `<li class="${st}${u.sub ? " sub" : ""}"><span class="t num">${hm(s.start)}</span><span class="n">${esc(L(u.title))}</span><span class="s">${i === sch.current ? esc(U().now) : i === sch.current + 1 ? esc(U().next) : ""}</span></li>`; }).join("");
    const cur = el.querySelector(".cur"); if (cur) { const top = cur.offsetTop - el.clientHeight / 2 + cur.offsetHeight / 2; el.scrollTop = Math.max(0, top); }
  }

  // ---------- Sections ----------
  function sectionPlan(u, unitDurMs) {
    const secs = u.sections || [];
    if (!secs.length) return { list: [], total: 0 };
    const known = secs.reduce((a, s) => a + (s.duration > 0 ? s.duration * 1000 : 0), 0);
    const missing = secs.filter(s => !(s.duration > 0)).length;

  layout(); idle();
  setInterval(tick, 250);
  if (G.liveUrl) { poll().then(tick); setInterval(poll, (SCREEN ? Math.max(5, G.pollSeconds || 10) : 30) * 1000); }
  // Room screen: warm the spot files during the evening so the projection starts instantly
  if (SCREEN) setTimeout(() => (G.media.spots || []).forEach(x => { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = x.src; v.style.display = "none"; document.body.appendChild(v); }), 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll().then(tick); } });
})();
</script>
</body>
