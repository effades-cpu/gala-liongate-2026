<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c0b0b">
<title>Soirée de gala LIONGATE · 28 novembre 2026</title>
<meta name="description" content="Soirée de gala LIONGATE, 28 novembre 2026, Élites Offices, Douala. Le déroulé en direct.">
<link rel="icon" href="assets/logos/liongate-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ox:#441212; --ox-2:#5a1d1b; --ox-3:#2c0b0b; --ox-4:#1d0707;
  --ground:#f2eee9; --card:#fdfbf8; --raised:#e9e3db;
  --t1:#1f1717; --t2:#5e524c; --t3:#7b6f68;
  --sand:#f1d7a1; --ochre:#ce943c; --gold:#e3b25a; --live:#4cc38a; --warn:#f0a04b;
  --ease:cubic-bezier(.2,.7,.2,1); --fast:180ms; --mid:420ms; --slow:900ms;
  --serif:"EB Garamond",Garamond,Georgia,serif; --sans:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--ox-4);color:var(--ground);-webkit-font-smoothing:antialiased;overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.hide-cursor,body.hide-cursor *{cursor:none!important}

/* ===== Stage: 1920×1080 scaled to fit (presentation mode) ===== */
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:var(--ox-4)}
#stage{position:relative;width:1920px;height:1080px;transform-origin:center center;background:var(--ox-3);overflow:hidden;display:flex;flex-direction:column}

/* ===== HUD (header) ===== */
#hud{position:relative;z-index:20;height:112px;flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:40px;padding:0 44px;
  background:linear-gradient(180deg,rgba(29,7,7,.92),rgba(29,7,7,.78));border-bottom:1px solid rgba(241,215,161,.12);transition:background var(--mid) var(--ease)}
body.s-before #hud,body.s-open #hud,body.s-after #hud{background:linear-gradient(180deg,rgba(20,5,5,.86),rgba(20,5,5,0));border-bottom-color:transparent}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:58px;width:auto}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-size:14px;color:rgba(242,238,233,.66);margin-top:6px;letter-spacing:.04em}
.now{display:flex;align-items:center;gap:22px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  background:rgba(253,251,248,.08);border:1px solid rgba(241,215,161,.2);color:var(--sand)}
.badge .dot{width:10px;height:10px;border-radius:50%;background:var(--ochre)}
.badge.live{color:#dff7ea;border-color:rgba(76,195,138,.45);background:rgba(76,195,138,.14)}
.badge.live .dot{background:var(--live);animation:pulse 1.8s var(--ease) infinite}
.badge.hold{color:#ffe3c2;border-color:rgba(240,160,75,.5);background:rgba(240,160,75,.14)}
.badge.hold .dot{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,195,138,.55)}70%{box-shadow:0 0 0 12px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
.stepinfo{min-width:0;flex:1}
.stepinfo .l1{display:flex;align-items:baseline;gap:14px;font-size:15px;color:rgba(242,238,233,.7);white-space:nowrap;overflow:hidden}
.stepinfo .l1 #stepWho{min-width:0;overflow:hidden;text-overflow:ellipsis}
.stepinfo .l1 b{color:var(--sand);font-weight:600;letter-spacing:.06em}
.stepinfo .ttl{font-family:var(--serif);font-size:28px;line-height:1.08;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
body.s-before #hud,body.s-open #hud,body.s-after #hud{text-shadow:0 1px 12px rgba(0,0,0,.65)}
body.s-before #stepNo,body.s-before .bar,body.s-after .stepinfo{display:none}
.bar{height:4px;border-radius:4px;background:rgba(241,215,161,.14);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ochre),var(--sand));border-radius:4px;transition:width 1s linear}
.hold .bar i,.bar.over i{background:var(--warn)}
.right{display:flex;align-items:center;gap:26px}
.timer{text-align:right;line-height:1}
.timer b{display:block;font-size:46px;font-weight:500;letter-spacing:-.01em;color:var(--ground)}
.timer span{display:block;font-size:13px;color:rgba(242,238,233,.62);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}
.timer.over b{color:var(--warn)}
.timer.soon b{font-size:52px}
.endin{font-size:14px;color:rgba(242,238,233,.62);text-align:right;line-height:1.35;white-space:nowrap}
.endin b{display:block;color:var(--sand);font-size:20px;font-weight:500}
.tools{display:flex;gap:8px}
.tbtn{height:44px;min-width:44px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;
  background:rgba(253,251,248,.08);border:1px solid rgba(241,215,161,.2);color:var(--ground);transition:background var(--fast) var(--ease)}
.tbtn:hover{background:rgba(253,251,248,.16)}
.tbtn svg{width:20px;height:20px}
.lang{display:flex;padding:4px;gap:2px;border-radius:999px;background:rgba(253,251,248,.08);border:1px solid rgba(241,215,161,.2)}
.lang button{height:34px;padding:0 12px;border-radius:999px;font-size:13px;color:rgba(242,238,233,.75)}
.lang button[aria-pressed="true"]{background:var(--ground);color:var(--ox)}
.sound-cta{position:absolute;z-index:25;right:44px;bottom:44px;display:none;align-items:center;gap:12px;height:60px;padding:0 26px;border-radius:999px;
  background:var(--ground);color:var(--ox);font-size:18px;font-weight:600;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:rise var(--slow) var(--ease)}
.sound-cta svg{width:24px;height:24px}
body.needs-sound .sound-cta{display:inline-flex}
body.hide-cursor .tools,body.hide-cursor .sound-cta.quiet{opacity:0;transition:opacity var(--mid)}

/* ===== Scenes ===== */
#scene{position:absolute;inset:0;z-index:1}
#scene > .layer{position:absolute;inset:0;animation:fadein var(--slow) var(--ease)}
#scene > .layer.talk{top:112px}
body.s-before .endin{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.bgvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,5,5,.15) 0%,rgba(20,5,5,0) 30%,rgba(20,5,5,.25) 65%,rgba(20,5,5,.85) 100%)}

/* Cover (before): nothing over the teaser but the HUD and a discreet button */
.cover-foot{position:absolute;left:44px;bottom:44px;display:flex;gap:12px;align-items:center}
.ghost{height:52px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;font-size:16px;
  background:rgba(20,5,5,.42);border:1px solid rgba(241,215,161,.25);color:var(--ground);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ghost:hover{background:rgba(20,5,5,.6)}

/* Open step */
.open-copy{position:absolute;left:88px;right:88px;bottom:88px;display:flex;align-items:flex-end;justify-content:space-between;gap:48px}
.open-copy h1{font-family:var(--serif);font-weight:400;font-size:104px;line-height:.98;letter-spacing:-.015em;max-width:15ch;animation:rise var(--slow) var(--ease) both}
.open-copy p{font-size:24px;color:rgba(242,238,233,.82);margin-top:18px;max-width:40ch;animation:rise var(--slow) var(--ease) .12s both}
.upnext{flex:none;min-width:420px;padding:26px 30px;border-radius:24px;background:rgba(20,5,5,.5);border:1px solid rgba(241,215,161,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:rise var(--slow) var(--ease) .24s both}
.upnext small{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand)}
.upnext b{display:block;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1;margin-top:10px}
.upnext span{display:block;font-size:17px;color:rgba(242,238,233,.75);margin-top:8px}
.ambient{position:absolute;inset:0;background:var(--ox-3)}
.ambient img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;opacity:0;transition:opacity 1.6s var(--ease)}
.ambient img.on{opacity:1;animation:kenburns 14s linear both}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14)}}

/* After */
.after{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.after .in{animation:rise var(--slow) var(--ease) both}
.after h1{font-family:var(--serif);font-weight:400;font-size:120px;line-height:1}
.after p{font-size:24px;color:rgba(242,238,233,.8);margin-top:20px}
.after .duo{margin:48px auto 0}

/* ===== Talk (presenter) layout ===== */
.talk{position:absolute;left:0;right:0;top:112px;bottom:0;display:grid;grid-template-columns:560px 1fr;gap:32px;padding:32px 40px 36px;
  background:radial-gradient(120% 90% at 70% 0%,#4a1715 0%,#2c0b0b 60%,#220808 100%)}
.side{display:flex;flex-direction:column;gap:20px;min-height:0}
.pcard{position:relative;padding:30px 30px 28px;border-radius:28px;background:linear-gradient(160deg,rgba(253,251,248,.1),rgba(253,251,248,.03));border:1px solid rgba(241,215,161,.2);overflow:hidden;animation:rise var(--slow) var(--ease) both}
.pcard::after{content:"";position:absolute;left:30px;right:30px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--ochre),transparent)}
.pcard .who{display:flex;align-items:center;gap:22px}
.medal{flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:48px;color:var(--ox);letter-spacing:.02em;
  background:radial-gradient(70% 70% at 35% 30%,#f9e7c0 0%,#e9c98a 55%,#c99f5f 100%);box-shadow:0 0 0 6px rgba(241,215,161,.14),0 18px 36px rgba(0,0,0,.35)}
.medal img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pcard .name{font-family:var(--serif);font-size:42px;line-height:1.04;letter-spacing:-.005em}
.pcard .role{font-size:22px;color:rgba(242,238,233,.78);margin-top:10px;line-height:1.4}
.chip{display:inline-flex;align-items:center;margin-top:14px;height:34px;padding:0 16px;border-radius:999px;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand);border:1px solid rgba(241,215,161,.3)}
.pcard .topic{margin-top:22px;padding-top:18px;border-top:1px solid rgba(241,215,161,.14);font-size:18px;color:rgba(242,238,233,.7)}
.pcard .topic b{display:block;color:var(--ground);font-family:var(--serif);font-weight:400;font-size:26px;margin-top:4px;line-height:1.15}
.runlist{list-style:none;flex:1;min-height:0;overflow:hidden;border-radius:24px;background:rgba(253,251,248,.04);border:1px solid rgba(241,215,161,.1);padding:10px}
.runlist li{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;font-size:20px;transition:background var(--mid) var(--ease),opacity var(--mid)}
.runlist li .t{color:rgba(242,238,233,.6)}
.runlist li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runlist li .s{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand)}
.runlist li.past .n,.runlist li.past .t{color:rgba(242,238,233,.6)}
.runlist li.cur{background:rgba(241,215,161,.14)}
.runlist li.cur .n{color:#fff;font-weight:500}
.runlist li.sub .n{padding-left:18px;position:relative}
.runlist li.sub .n::before{content:"↳";position:absolute;left:0;color:var(--sand)}

.main{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.frame{position:relative;flex:1;border-radius:28px;overflow:hidden;background:var(--ox-2);box-shadow:0 30px 60px rgba(0,0,0,.35)}
.slidebox{position:absolute;left:0;top:0;width:1264px;height:856px;transform-origin:0 0}
.slide{position:absolute;inset:0;overflow:hidden;animation:slidein var(--slow) var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(40px) scale(.99)}to{opacity:1;transform:none}}
.slide.leave{animation:slideout var(--mid) var(--ease) both}
@keyframes slideout{to{opacity:0;transform:translateX(-30px)}}
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:20px;height:40px;color:rgba(242,238,233,.75);font-size:18px}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(241,215,161,.28);transition:all var(--mid) var(--ease)}
.dots i.on{width:34px;border-radius:9px;background:var(--sand)}
.secbar{flex:1;max-width:360px;height:3px;border-radius:3px;background:rgba(241,215,161,.14);overflow:hidden}
.secbar i{display:block;height:100%;width:0;background:var(--sand);transition:width .25s linear}

/* ---- Section layouts (designed at 1264×856) ---- */
.s-logos{background:radial-gradient(90% 90% at 50% 40%,#5a1d1b,#2c0b0b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;text-align:center}
.duo{display:flex;align-items:center;gap:72px}
.duo img{height:300px;width:auto;object-fit:contain;animation:rise 1.1s var(--ease) both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.duo img.drc{height:220px;animation-delay:.25s}
.duo .sep{width:1px;height:240px;background:linear-gradient(180deg,transparent,var(--gold),transparent);animation:fadein 1.2s var(--ease) .15s both}
.s-logos h2{font-family:var(--serif);font-weight:400;font-size:60px;line-height:1.1;max-width:22ch;animation:rise 1s var(--ease) .45s both}

.s-alt{display:grid;place-items:center;background:#f2eee9;animation:altbg 14s ease-in-out infinite}
@keyframes altbg{0%,38%{background:#f2eee9}50%,88%{background:#3a0f0f}100%{background:#f2eee9}}
.s-alt .logo{position:relative;width:640px;height:436px}
.s-alt .logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.s-alt .logo .k{animation:altk 14s ease-in-out infinite}
.s-alt .logo .c{animation:altc 14s ease-in-out infinite}
@keyframes altk{0%,38%{opacity:1;transform:scale(1)}46%{opacity:0;transform:scale(1.03)}88%{opacity:0;transform:scale(1.03)}96%,100%{opacity:1;transform:scale(1)}}
@keyframes altc{0%,46%{opacity:0;transform:scale(.97)}50%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(.97)}}
.s-alt .shine{position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);animation:shine 7s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.s-alt .cap{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:22px;letter-spacing:.14em;color:#441212;text-transform:uppercase;animation:altcap 14s ease-in-out infinite}
@keyframes altcap{0%,38%{color:#441212}50%,88%{color:#f1d7a1}100%{color:#441212}}

.s-title{background:radial-gradient(100% 100% at 30% 20%,#5a1d1b,#2c0b0b);display:flex;flex-direction:column;justify-content:center;padding:96px}
.s-title small{font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand);animation:rise 1s var(--ease) both}
.s-title h2{font-family:var(--serif);font-weight:400;font-size:88px;line-height:1.02;margin-top:22px;max-width:16ch;animation:rise 1s var(--ease) .1s both}
.s-title p{font-size:32px;color:rgba(242,238,233,.8);margin-top:26px;max-width:46ch;animation:rise 1s var(--ease) .2s both}

.s-ti{background:var(--ground);color:var(--t1);display:grid;grid-template-columns:1fr 1fr;gap:0}
.s-ti .txt{padding:72px 64px;display:flex;flex-direction:column;justify-content:center}
.s-ti h2{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1.04;color:var(--ox);animation:rise 1s var(--ease) both}
.s-ti p{font-size:32px;line-height:1.45;color:var(--t2);margin-top:24px;animation:rise 1s var(--ease) .1s both}
.s-ti .img{position:relative;background:var(--ox)}
.s-ti .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 20s linear both}
.steps{list-style:none;counter-reset:s;display:grid;gap:14px}
.s-ti .img .steps{position:absolute;inset:0;padding:84px 64px;align-content:center}
.steps li{counter-increment:s;display:flex;align-items:center;gap:18px;padding:20px 24px;border-radius:18px;background:rgba(253,251,248,.07);border:1px solid rgba(241,215,161,.16);font-size:26px;color:var(--ground);animation:rise .9s var(--ease) both}
.steps li::before{content:counter(s,decimal-leading-zero);flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:var(--ox);font-size:16px;font-weight:600}
.steps li:nth-child(2){animation-delay:.15s}.steps li:nth-child(3){animation-delay:.3s}.steps li:nth-child(4){animation-delay:.45s}.steps li:nth-child(5){animation-delay:.6s}
.s-ti .txt .steps li{background:var(--card);border-color:rgba(31,23,23,.09);color:var(--t1);font-size:24px;padding:14px 18px}
.s-ti .txt .steps{margin-top:30px}

.s-car{background:#140505}
.s-car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s var(--ease)}
.s-car img.on{opacity:1;animation:kenburns 9s linear both}
.s-car img.contain.on{animation:none}
.s-car.fit .cap{top:28px;bottom:auto;align-items:flex-start}
.s-car img.contain{object-fit:contain;padding:56px;background:var(--ground)}
.s-car .cap{position:absolute;left:36px;bottom:36px;right:36px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.s-car .cap b{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;padding:14px 22px;border-radius:18px;background:rgba(20,5,5,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:24ch}
.s-car .cap span{font-size:20px;padding:8px 16px;border-radius:999px;background:rgba(20,5,5,.8)}

.s-prod{background:var(--ground);color:var(--t1);display:grid;grid-template-columns:480px 1fr}
.s-prod .pv{position:relative;background:var(--card);border-right:1px solid rgba(31,23,23,.08)}
.s-prod .pv img{position:absolute;left:50%;top:50%;max-width:78%;max-height:74%;transform:translate(-50%,-46%);opacity:0;transition:opacity .8s var(--ease),transform 1s var(--ease)}
.s-prod .pv img.on{opacity:1;transform:translate(-50%,-50%)}
.s-prod .pv::after{content:"";position:absolute;left:18%;right:18%;bottom:70px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(68,18,18,.18),transparent)}
.s-prod .pd{padding:64px 56px;display:flex;flex-direction:column;justify-content:center}
.s-prod small{font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#8a5f1f}
.s-prod h2{font-family:var(--serif);font-weight:400;font-size:62px;line-height:1.05;color:var(--ox);margin-top:16px}
.s-prod p{font-size:32px;line-height:1.4;color:var(--t2);margin-top:20px}
.s-prod ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.s-prod li{padding:10px 18px;border-radius:999px;border:1px solid rgba(31,23,23,.14);font-size:24px;color:var(--t1)}
.s-prod .swap{animation:rise .8s var(--ease) both}
.s-prod .pdots{display:flex;gap:8px;margin-top:40px}
.s-prod .pdots i{width:10px;height:10px;border-radius:50%;background:rgba(68,18,18,.2);transition:all var(--mid)}
.s-prod .pdots i.on{width:36px;border-radius:10px;background:var(--ox)}

.s-tl{background:var(--ground);color:var(--t1);padding:88px 80px;display:flex;flex-direction:column;justify-content:center}
.s-tl h2{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1.08;color:var(--ox);max-width:22ch;animation:rise 1s var(--ease) both}

.s-quote{background:radial-gradient(100% 100% at 50% 30%,#5a1d1b,#2c0b0b);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px}

<body class="s-before">
<div id="viewport">
  <div id="stage">
    <header id="hud">
      <div class="brand"><img src="assets/logos/liongate-emblem.png" alt=""><div><b>LIONGATE</b><small id="brandSub"></small></div></div>
      <div class="now">
        <span class="badge num" id="badge"><span class="dot"></span><span id="badgeText"></span></span>
        <div class="stepinfo">
          <div class="l1"><b id="stepNo"></b><span id="stepTime" class="num"></span><span id="stepWho"></span></div>
          <div class="ttl" id="stepTitle"></div>
          <div class="bar" id="bar"><i></i></div>
        </div>
      </div>
      <div class="right">
        <div class="timer num" id="timer" aria-live="off"><b id="timerVal">--:--</b><span id="timerLbl"></span></div>
        <div class="endin num" id="endin"></div>
        <div class="tools">
          <button class="tbtn" id="progBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="lbl" id="progLbl">Programme</span></button>
          <button class="tbtn" id="muteBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="muteWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg></button>
          <div class="lang" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
          <button class="tbtn" id="fsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl" id="fsLbl">Plein écran</span></button>
        </div>
      </div>
    </header>
    <main id="scene" aria-live="polite"></main>
    <button class="sound-cta" id="soundCta" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg><span id="soundLbl">Activer le son</span></button>
    <div id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="panel">
      <button class="tbtn close" id="drawerClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <h2 id="drawerTitle"></h2><p class="meta" id="drawerMeta"></p><ol id="drawerList"></ol><p class="foot-note" id="drawerNote"></p>
    </div></div>
  </div>
</div>

<script src="content.js"></script>
<script src="engine.js"></script>
<script>
(() => {
  "use strict";
  const G = window.GALA, E = window.GalaEngine;
  const qs = new URLSearchParams(location.search);
  const SCREEN = qs.has("ecran") || qs.has("screen");
  if (qs.get("live") && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) G.liveUrl = qs.get("live"); // local testing only
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  const UI = {
    fr: { soon: "Le programme commence dans", live: "En direct", hold: "En pause", before: "Bientôt", after: "Terminé", step: "Étape", left: "restant", over: "dépassement", paused: "en pause", endIn: "Fin de soirée dans", end: "Fin prévue", programme: "Programme", next: "À suivre", in: "dans", now: "En cours", done: "Merci d'avoir été là", doneLine: "Au plaisir de vous retrouver.", sound: "Activer le son", soundOff: "Couper le son", full: "Plein écran", exitFull: "Quitter", close: "Fermer", note: "Horaires mis à jour en direct par la régie.", noteOffline: "Horaires du programme prévu.", topic: "Intervention", section: "Section", spotOf: "Spot", startsAt: "à", h: "h" },
    en: { soon: "The programme starts in", live: "Live", hold: "On hold", before: "Soon", after: "Ended", step: "Step", left: "left", over: "overtime", paused: "on hold", endIn: "Evening ends in", end: "Planned end", programme: "Programme", next: "Up next", in: "in", now: "Now", done: "Thank you for joining us", doneLine: "We look forward to seeing you again.", sound: "Turn sound on", soundOff: "Mute", full: "Full screen", exitFull: "Exit", close: "Close", note: "Times updated live by the stage manager.", noteOffline: "Times from the planned programme.", topic: "Session", section: "Section", spotOf: "Spot", startsAt: "at", h: "h" },
  };
  let lang = store.get("gala-lang") === "en" ? "en" : "fr";
  const L = (o) => (o && typeof o === "object" && !Array.isArray(o)) ? (o[lang] ?? o.fr ?? "") : (o ?? "");
  const U = () => UI[lang];

  // ---------- Units (steps + sub-steps flattened) ----------
  const units = [];
  G.steps.forEach((s, i) => {
    units.push({ ...s, no: i + 1, sub: false, parent: null });
    (s.substeps || []).forEach((ss, k) => units.push({ kind: "talk", ...ss, no: i + 1, subNo: k + 2, sub: true, parent: s }));
  });
  const ids = units.map(u => u.id);
  const planStart = Date.parse(G.event.start);

  // ---------- Time: server offset + optional simulation (?t=HH:MM or ISO) ----------
  let serverOffset = 0, simOffset = 0;
  if (qs.get("t")) {
    const t = qs.get("t"), m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(t), d = m ? Date.parse(G.event.start.slice(0, 11) + m[1].padStart(2, "0") + ":" + m[2] + ":" + (m[3] || "00") + G.event.start.slice(19)) : Date.parse(t);
    if (isFinite(d)) simOffset = d - Date.now();
  }
  const now = () => Date.now() + serverOffset + simOffset;

  // ---------- Live state from Apps Script (with last-good cache) ----------
  let live = {}, liveOk = false;
  // Rehearsal leftovers (anchors/pauses stamped long before the event) must never push the gala into the past
  function dropStale(x) {
    if (!x) return x; const min = planStart - 12 * 36e5;
    Object.keys(x.anchors || {}).forEach(k => { if (x.anchors[k] < min) delete x.anchors[k]; });
    if (x.paused && x.paused.since < min) x.paused = null;
    if (x.start && x.start < min) x.start = null;
    return x;
  }
  try { const c = JSON.parse(store.get("gala-live") || "null"); if (c && G.liveUrl && c.url === G.liveUrl && c.at > Date.now() - 6 * 36e5) { live = dropStale(E.cleanLive(c.live, ids)) || {}; serverOffset = c.offset || 0; } } catch (e) {}
  async function poll() {
    if (!G.liveUrl) return;
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 8000);
    try {
      const t0 = Date.now();
      const r = await fetch(G.liveUrl + (G.liveUrl.includes("?") ? "&" : "?") + "format=json&_=" + t0, { cache: "no-store", signal: ctl && ctl.signal });
      const j = await r.json(), t1 = Date.now();
      if (j && j.ok) {
        const clean = dropStale(E.cleanLive(j, ids));
        if (clean) {
          live = clean; liveOk = true;
          if (typeof j.serverTime === "number") serverOffset = j.serverTime - (t0 + t1) / 2;
          store.set("gala-live", JSON.stringify({ live: j, offset: serverOffset, at: Date.now(), url: G.liveUrl }));
        }
      }
    } catch (e) { liveOk = false; } finally { clearTimeout(to); }
  }

  function schedule() {
    const plan = { start: (live && live.start) || planStart, units: units.map(u => ({ id: u.id, duration: u.duration })) };
    return E.computeSchedule(plan, live, now());
  }

  // ---------- Formatting ----------
  const pad = (n) => String(n).padStart(2, "0");
  const hm = (ms) => { const d = new Date(ms + 36e5); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); }; // Douala = UTC+1
  const dur = (ms) => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`; };
  const hours = (ms) => { const m = Math.max(0, Math.round(ms / 6e4)); return m >= 60 ? `${Math.floor(m / 60)} h ${pad(m % 60)}` : `${m} min`; };
  const initials = (n) => n.replace(/^(M\.\s+le|M\.|Mme|Mr|Dr|Pr)\s+/i, "").split(/\s+/).filter(w => w.length > 1 && !/^(de|du|la|le|des)$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const logoSrc = (k) => G.logos[k] || k;
  const imgTag = (src, alt, cls, extra) => src ? `<img src="${esc(src)}" alt="${esc(alt || "")}"${cls ? ` class="${cls}"` : ""}${extra || ""} onerror="this.style.visibility='hidden'">` : "";

  // ---------- Sound ----------
  let soundOn = false; // browsers require a user gesture on every load before sound can play
  function applySound() {
    document.querySelectorAll("video").forEach(v => { v.muted = !soundOn; });
    $("#muteBtn").setAttribute("aria-pressed", String(soundOn));
    $("#muteBtn").setAttribute("aria-label", soundOn ? U().soundOff : U().sound);
    $("#muteWave").style.opacity = soundOn ? 1 : .25;
    const anyVideo = !!document.querySelector("#scene video");
    document.body.classList.toggle("needs-sound", anyVideo && !soundOn);
  }
  function setSound(on) { soundOn = on; applySound(); document.querySelectorAll("#scene video").forEach(v => { if (v.paused && !v.ended) v.play().catch(() => {}); }); }
  $("#soundCta").addEventListener("click", () => setSound(true));
  $("#muteBtn").addEventListener("click", () => setSound(!soundOn));

  function playVideo(v) {
    v.muted = !soundOn; v.playsInline = true;
    const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; soundOn = false; v.play().catch(() => {}); applySound(); });
  }

  // ---------- Scene rendering ----------
  let sceneKey = "", secKey = "", manual = { id: null, k: null, at: 0 }, slideState = null;

  function teaserVideo() {
    const list = (G.media.teasers || []).filter(Boolean);
    if (!list.length) return "";
    return `<video class="bgvideo" data-teaser="0" src="${esc(list[0])}" poster="${esc(G.media.teaserPoster || "")}" muted playsinline autoplay preload="auto"></video>`;
  }
  function wireTeaser(root) {
    const v = root.querySelector("video[data-teaser]"); if (!v) return;
    const list = G.media.teasers.filter(Boolean);
    v.loop = list.length === 1;
    v.addEventListener("ended", () => { const k = (+v.dataset.teaser + 1) % list.length; v.dataset.teaser = k; v.src = list[k]; playVideo(v); });
    playVideo(v);
  }

  function renderScene(sch) {
    const sc = $("#scene"), cur = sch.current >= 0 ? units[sch.current] : null;
    const phase = sch.phase === "live" && cur ? (cur.kind === "open" ? "open" : "talk") : sch.phase;
    document.body.className = document.body.className.replace(/\bs-\w+/g, "").trim() + " s-" + phase;
    slideState = null; document.body.classList.remove("spotfull");
    let html = "";
    if (phase === "before") {
      html = `<div class="layer cover">${teaserVideo()}<div class="shade" style="opacity:.55"></div><div class="cover-foot"><button class="ghost" type="button" data-open-prog>${esc(U().programme)} →</button></div></div>`;
    } else if (phase === "open") {
      const nx = sch.next >= 0 ? units[sch.next] : null;
      const bg = cur.scene === "teaser" ? teaserVideo() : `<div class="ambient">${(cur.images || []).map((s, k) => imgTag(s, "", k === 0 ? "on" : "")).join("")}</div>`;
      html = `<div class="layer openstep">${bg}<div class="shade"></div><div class="open-copy"><div><h1>${esc(L(cur.title))}</h1>${cur.line ? `<p>${esc(L(cur.line))}</p>` : ""}</div>${nx ? `<div class="upnext"><small>${esc(U().next)}</small><b>${esc(L(nx.title))}</b><span class="num" data-upnext></span></div>` : ""}</div></div>`;
    } else if (phase === "after") {
      html = `<div class="layer afterstep">${teaserVideo()}<div class="shade" style="background:rgba(20,5,5,.72)"></div><div class="after"><div class="in"><h1>${esc(U().done)}</h1><p>${esc(U().doneLine)}</p><div class="duo">${imgTag(logoSrc("liongate"), "LIONGATE")}<span class="sep"></span>${imgTag(logoSrc("drc"), "Dorothy Roffat Cosmetics", "drc")}</div></div></div></div>`;
    } else {
      html = `<div class="layer talk"><aside class="side">${presenterCard(cur)}<ol class="runlist" id="runlist"></ol></aside><div class="main"><div class="frame" id="frame"><div class="slidebox" id="slidebox"></div></div><div class="foot"><span id="secLabel" class="num"></span><span class="secbar"><i id="secBar"></i></span><span class="dots" id="dots"></span></div></div></div>`;
    }
    sc.innerHTML = html;
    wireTeaser(sc);
    sc.querySelectorAll("[data-open-prog]").forEach(b => b.addEventListener("click", openDrawer));
    if (phase === "talk") { fitSlide(); secKey = ""; renderRunlist(sch); }
    applySound();
  }

  function presenterCard(u) {
    const p = u.presenter || (u.parent && u.parent.presenter);
    if (!p) return "";
    const mono = p.monogram || initials(p.name);
    const medal = p.photo ? `<span class="medal"><img src="${esc(p.photo)}" alt="" data-m="${esc(mono)}" onerror="this.parentNode.textContent=this.dataset.m"></span>` : `<span class="medal" aria-hidden="true">${esc(mono)}</span>`;
    const topic = u.sub ? `${L(u.parent.title)} · ${L(u.title)}` : L(u.title);
    return `<section class="pcard" aria-label="${esc(p.name)}"><div class="who">${medal}<div><div class="name">${esc(p.name)}</div>${L(p.role) ? `<div class="role">${esc(L(p.role))}</div>` : ""}${p.org ? `<span class="chip">${esc(p.org)}</span>` : ""}</div></div><div class="topic">${esc(U().topic)}<b>${esc(topic)}</b></div></section>`;
  }

  function renderRunlist(sch) {
    const el = $("#runlist"); if (!el) return;
    el.innerHTML = sch.units.map((s, i) => { const u = units[i]; const st = i < sch.current ? "past" : i === sch.current ? "cur" : ""; return `<li class="${st}${u.sub ? " sub" : ""}"><span class="t num">${hm(s.start)}</span><span class="n">${esc(L(u.title))}</span><span class="s">${i === sch.current ? esc(U().now) : i === sch.current + 1 ? esc(U().next) : ""}</span></li>`; }).join("");
    const cur = el.querySelector(".cur"); if (cur) { const top = cur.offsetTop - el.clientHeight / 2 + cur.offsetHeight / 2; el.scrollTop = Math.max(0, top); }
  }

  // ---------- Sections ----------
  function sectionPlan(u, unitDurMs) {
    const secs = u.sections || [];
    if (!secs.length) return { list: [], total: 0 };
    const known = secs.reduce((a, s) => a + (s.duration > 0 ? s.duration * 1000 : 0), 0);
    const missing = secs.filter(s => !(s.duration > 0)).length;
    const share = missing ? Math.max(20000, (unitDurMs - known) / missing) : 0;
    let t = 0; const list = secs.map(s => { const d = s.duration > 0 ? s.duration * 1000 : share; const r = { s, start: t, dur: d }; t += d; return r; });
    return { list, total: t };
  }
  function currentSection(u, unitSched, nowMs) {
    const sp = sectionPlan(u, unitSched.duration);
    if (!sp.list.length) return null;
    const n = sp.list.length, hold = n === 1 || sp.list.every(x => !(x.s.duration > 0));
    // Operator pressed next/previous: run from the chosen section, timed from the key press
    if (manual.id === u.id && typeof manual.k === "number") {
      let k = ((manual.k % n) + n) % n, e = Math.max(0, nowMs - manual.at), base = manual.at, guard = 0;
      while (e >= sp.list[k].dur && !(hold && k === n - 1) && guard++ < 500) { e -= sp.list[k].dur; base += sp.list[k].dur; k = (k + 1) % n; }
      const x = sp.list[k];
      return { k, n, s: x.s, start: base, dur: x.dur, el: e };
    }
    const el = Math.max(0, nowMs - unitSched.start);
    if (hold && el >= sp.total) { const x = sp.list[n - 1]; return { k: n - 1, n, s: x.s, start: unitSched.start + x.start, dur: x.dur, el: Math.min(el - x.start, x.dur) }; }
    const loop = el % sp.total;
    let k = sp.list.findIndex(x => loop >= x.start && loop < x.start + x.dur); if (k < 0) k = 0;
    const x = sp.list[k];
    return { k, n, s: x.s, start: unitSched.start + Math.floor(el / sp.total) * sp.total + x.start, dur: x.dur, el: Math.max(0, loop - x.start) };
  }

  function renderSection(sec, u) {
    const s = sec.s, box = $("#slidebox"); if (!box) return;
    const old = box.querySelector(".slide"); if (old) { old.classList.add("leave"); setTimeout(() => old.remove(), 420); }
    document.body.classList.toggle("spotfull", s.layout === "spots"); fitSlide();
    const d = document.createElement("div"); d.className = "slide";
    d.innerHTML = sectionHTML(s, u);
    box.appendChild(d);
    slideState = { s, el: d, k: -1 };
    if (s.layout === "spots") wireSpots(d);
    applySound();
  }

  function sectionHTML(s, u) {
    switch (s.layout) {
      case "logos": return `<div class="slide-in s-logos" style="position:absolute;inset:0"><div class="duo">${(s.logos || ["liongate", "drc"]).map((k, i) => (i ? `<span class="sep"></span>` : "") + imgTag(logoSrc(k), k, /drc/.test(k) ? "drc" : "")).join("")}</div>${s.title ? `<h2>${esc(L(s.title))}</h2>` : ""}</div>`;
      case "logo-alternate": return `<div class="s-alt" style="position:absolute;inset:0"><div class="logo">${imgTag(logoSrc("liongateBlack"), "LIONGATE", "k")}${imgTag(logoSrc("liongate"), "", "c", ' aria-hidden="true"')}</div><div class="shine"></div><div class="cap">${esc(L(s.caption) || L(u.title))}</div></div>`;
      case "title": return `<div class="s-title" style="position:absolute;inset:0">${s.kicker ? `<small>${esc(L(s.kicker))}</small>` : ""}<h2>${esc(L(s.title))}</h2>${s.text ? `<p>${esc(L(s.text))}</p>` : ""}</div>`;
      case "text-image": {
        const pts = L(s.points) || [];
        const steps = pts.length ? `<ol class="steps">${pts.map(p => `<li>${esc(p)}</li>`).join("")}</ol>` : "";
        return `<div class="s-ti" style="position:absolute;inset:0"><div class="txt"><h2>${esc(L(s.title))}</h2>${s.text ? `<p>${esc(L(s.text))}</p>` : ""}${s.image ? steps : ""}</div><div class="img">${s.image ? imgTag(s.image, L(s.title)) : steps}</div></div>`;
      }
      case "carousel": return `<div class="s-car${s.fit === "contain" ? " fit" : ""}" style="position:absolute;inset:0">${(s.images || []).map((src, k) => imgTag(src, "", (k === 0 ? "on" : "") + (s.fit === "contain" ? " contain" : ""))).join("")}<div class="cap">${s.title ? `<b>${esc(L(s.title))}</b>` : "<span></span>"}<span class="num" data-car></span></div></div>`;
      case "products": return `<div class="s-prod" style="position:absolute;inset:0"><div class="pv">${(s.items || []).map((p, k) => imgTag(p.image, p.name, k === 0 ? "on" : "")).join("")}</div><div class="pd"><small>${esc(L(s.title))}</small><div class="swap" data-pd></div><div class="pdots">${(s.items || []).map((_, k) => `<i class="${k === 0 ? "on" : ""}"></i>`).join("")}</div></div></div>`;
      case "timeline": return `<div class="s-tl" style="position:absolute;inset:0"><h2>${esc(L(s.title))}</h2><div class="row num">${(s.items || []).map(t => `<div><b>${esc(t.year)}</b><span>${esc(L(t.text))}</span></div>`).join("")}</div></div>`;
      case "quote": return `<div class="s-quote" style="position:absolute;inset:0">${imgTag(logoSrc("drcSignature"), "")}<blockquote>${esc(L(s.text))}</blockquote>${s.by ? `<p>${esc(s.by)}</p>` : ""}</div>`;
      case "spots": return `<div class="s-spot" style="position:absolute;inset:0"><video playsinline preload="auto"></video><span class="vlabel" data-vlabel></span><div class="vctl"><button class="tbtn" type="button" data-vplay aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button></div><div class="endcard">${imgTag(logoSrc("drc"), "Dorothy Roffat Cosmetics")}</div></div>`;
      default: return `<div class="s-title" style="position:absolute;inset:0"><h2>${esc(L(s.title) || L(u.title))}</h2></div>`;
    }
  }

  function spotList() {
    const all = (G.media.spots || []).filter(x => x && x.src);
    if (SCREEN || isFs()) return all;                          // room screen (?ecran=1 or full screen): VF then VE
    const mine = all.filter(x => x.lang === lang); return mine.length ? mine : all.slice(0, 1);
  }
  function wireSpots(root) {
    const v = root.querySelector("video"), list = spotList(), lab = root.querySelector("[data-vlabel]"), btn = root.querySelector("[data-vplay]");
    let k = 0;
    const load = () => { const x = list[k]; v.src = x.src; if (x.poster) v.poster = x.poster; lab.textContent = `${U().spotOf} · ${x.label || x.lang.toUpperCase()}`; playVideo(v); };
    v.addEventListener("ended", () => { k++; if (k < list.length) load(); else root.querySelector(".s-spot").classList.add("done"); });
    const icon = () => btn.innerHTML = v.paused ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>';
    v.addEventListener("play", icon); v.addEventListener("pause", icon);
    btn.addEventListener("click", () => { if (v.paused) { if (root.querySelector(".s-spot").classList.contains("done")) { root.querySelector(".s-spot").classList.remove("done"); k = 0; load(); } else playVideo(v); } else v.pause(); });
    if (list.length) load();
  }

  // Inner animation of the current section (carousels, product cards), driven by the shared clock
  function tickSection(sec, u) {
    if (!slideState) return;
    const s = sec.s, every = (s.every || 6) * 1000, el = slideState.el;
    if (s.layout === "carousel") {
      const imgs = el.querySelectorAll(".s-car img"); if (!imgs.length) return;
      const k = Math.floor(sec.el / every) % imgs.length;
      if (k !== slideState.k) { imgs.forEach((im, i) => im.classList.toggle("on", i === k)); slideState.k = k; const c = el.querySelector("[data-car]"); if (c) c.textContent = `${k + 1} / ${imgs.length}`; }
    }
    if (s.layout === "products") {
      const items = s.items || [], k = Math.floor(sec.el / every) % Math.max(1, items.length);
      if (k !== slideState.k && items[k]) {
        slideState.k = k; const p = items[k];
        el.querySelectorAll(".pv img").forEach((im, i) => im.classList.toggle("on", i === k));
        el.querySelectorAll(".pdots i").forEach((d, i) => d.classList.toggle("on", i === k));
        const pd = el.querySelector("[data-pd]"); pd.classList.remove("swap"); void pd.offsetWidth; pd.classList.add("swap");
        pd.innerHTML = `<h2>${esc(p.name)}</h2><p>${esc(L(p.text))}</p><ul>${(L(p.actives) || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
      }
    }
  }

  function fitSlide() {
    const f = $("#frame"), b = $("#slidebox"); if (!f || !b) return;
    const W = b.offsetWidth, H = b.offsetHeight, s = Math.min(f.clientWidth / W, f.clientHeight / H);
    b.style.transform = `translate(${(f.clientWidth - W * s) / 2}px,${(f.clientHeight - H * s) / 2}px) scale(${s})`;
  }

  // ---------- HUD ----------
  function renderHud(sch) {
    const u = U(), t = now(), cur = sch.current >= 0 ? units[sch.current] : null, cs = cur ? sch.units[sch.current] : null;
    const badge = $("#badge"), held = cs && cs.paused;
    badge.className = "badge num" + (sch.phase === "live" ? (held ? " hold" : " live") : "");
    $("#badgeText").textContent = sch.phase === "live" ? (held ? u.hold : u.live) : sch.phase === "before" ? u.before : u.after;
    $("#brandSub").textContent = `${L(G.event.dateLabel)} · ${L(G.event.place)}`;
    const timer = $("#timer"); timer.className = "timer num";
    const bar = $("#bar i");
    if (sch.phase === "before") {
      const first = units[0];
      $("#stepNo").textContent = `${u.step} 1/${G.steps.length}`;
      $("#stepTime").textContent = `${hm(sch.first)}`;
      $("#stepWho").textContent = "";
      $("#stepTitle").textContent = L(first.title);
      $("#timerVal").textContent = dur(sch.first - t); $("#timerLbl").textContent = u.soon; timer.classList.add("soon");
      bar.style.width = "0%";
      $("#endin").innerHTML = `${esc(L(G.event.title))}<b>${esc(L(G.event.dateLabel))}</b>`;
    } else if (sch.phase === "live" && cur) {
      const p = cur.presenter || (cur.parent && cur.parent.presenter);
      $("#stepNo").textContent = `${u.step} ${cur.no}${cur.sub ? "." + cur.subNo : ""}/${G.steps.length}`;
      $("#stepTime").textContent = `${hm(cs.start)} – ${hm(cs.end)}`;
      $("#stepWho").textContent = p ? p.name : "";
      $("#stepTitle").textContent = L(cur.title);
      if (cur.sub) $("#stepWho").textContent = L(cur.parent.title) + (p ? " · " + p.name : "");
      const planned = cs.duration, el = t - cs.start;
      $("#timerVal").textContent = dur(cs.end - t);
      $("#timerLbl").textContent = held ? u.paused : u.left;
      if (held) timer.classList.add("over");
      bar.style.width = Math.min(100, Math.max(0, el / Math.max(1, cs.end - cs.start) * 100)) + "%";
      $("#bar").classList.toggle("over", !!held);
      $("#endin").innerHTML = `${esc(u.endIn)}<b>${esc(hours(sch.end - t))}</b>`;
    } else {
      $("#stepNo").textContent = ""; $("#stepTime").textContent = ""; $("#stepWho").textContent = "";
      $("#stepTitle").textContent = u.done; $("#timerVal").textContent = hm(sch.end); $("#timerLbl").textContent = u.end; bar.style.width = "100%";
      $("#endin").innerHTML = "";
    }
    const up = document.querySelector("[data-upnext]");
    if (up && sch.next >= 0) up.textContent = `${hm(sch.units[sch.next].start)} · ${u.in} ${dur(sch.units[sch.next].start - t)}`;
  }

  // ---------- Drawer (programme) ----------
  function renderDrawer(sch) {
    $("#drawerTitle").textContent = U().programme;
    $("#drawerMeta").textContent = `${L(G.event.dateLabel)} · ${L(G.event.place)}`;
    $("#drawerList").innerHTML = sch.units.map((s, i) => { const u = units[i], p = u.presenter; return `<li class="${i < sch.current ? "past" : i === sch.current ? "cur" : ""}${u.sub ? " sub" : ""}"><span class="t num">${hm(s.start)}</span><span>${esc(L(u.title))}${p ? `<small>${esc(p.name)}</small>` : ""}</span></li>`; }).join("");
    $("#drawerNote").textContent = G.liveUrl && liveOk ? U().note : U().noteOffline;
    $("#drawerClose").setAttribute("aria-label", U().close);
  }
  let lastFocus = null;
  const setInert = (v) => ["#hud", "#scene", "#soundCta"].forEach(x => { $(x).inert = v; });
  function openDrawer() { lastFocus = document.activeElement; renderDrawer(schedule()); $("#drawer").classList.add("open"); setInert(true); $("#drawerClose").focus(); }
  function closeDrawer() { $("#drawer").classList.remove("open"); setInert(false); if (lastFocus) lastFocus.focus(); }
  $("#progBtn").addEventListener("click", openDrawer);
  $("#drawerClose").addEventListener("click", closeDrawer);
  $("#drawer").addEventListener("click", e => { if (e.target.id === "drawer") closeDrawer(); });

  // ---------- Main loop ----------
  let lastRunKey = "";
  function tick() {
    const sch = schedule(), cur = sch.current >= 0 ? units[sch.current] : null;
    const phase = sch.phase === "live" && cur ? (cur.kind === "open" ? "open" : "talk") : sch.phase;
    const key = phase + "|" + (cur ? cur.id : "") + "|" + lang;
    if (key !== sceneKey) { sceneKey = key; if (manual.id !== (cur && cur.id)) manual = { id: cur && cur.id, k: null, at: 0 }; renderScene(sch); }
    renderHud(sch);
    if (phase === "talk") {
      const rk = sch.units.map(s => s.start).join(",") + sch.current; if (rk !== lastRunKey) { lastRunKey = rk; renderRunlist(sch); }
      const sec = currentSection(cur, sch.units[sch.current], now());
      if (sec) {
        const sk = cur.id + "#" + sec.k + "#" + sec.start + "#" + lang;
        if (sk !== secKey) { secKey = sk; renderSection(sec, cur); $("#dots").innerHTML = sec.n > 1 ? Array.from({ length: sec.n }, (_, i) => `<i class="${i === sec.k ? "on" : ""}"></i>`).join("") : ""; }
        $("#secLabel").textContent = sec.n > 1 ? `${U().section} ${sec.k + 1}/${sec.n}` : "";
        $("#secBar").style.width = sec.n > 1 ? Math.min(100, sec.el / sec.dur * 100) + "%" : "0%";
        tickSection(sec, cur);
      }
    }
    if (phase === "open" && cur && cur.scene !== "teaser") {
      const imgs = document.querySelectorAll(".ambient img"); if (imgs.length > 1) { const k = Math.floor((now() - sch.units[sch.current].start) / 8000) % imgs.length; imgs.forEach((im, i) => { if (im.classList.contains("on") !== (i === k)) im.classList.toggle("on", i === k); }); }
    }
    if ($("#drawer").classList.contains("open")) renderDrawer(sch);
  }

  // ---------- Layout: scaled stage vs flow ----------
  function layout() {
    const w = innerWidth, h = innerHeight, flow = !SCREEN && (w < 900 || w / h < 1.15);
    document.body.classList.toggle("flow", flow);
    const st = $("#stage");
    st.style.transform = flow ? "" : `scale(${Math.min(w / 1920, h / 1080)})`;
    fitSlide();
  }
  addEventListener("resize", layout);

  // ---------- Language ----------
  function setLang(l) {
    lang = l; store.set("gala-lang", l); document.documentElement.lang = l;
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    document.title = l === "fr" ? "Soirée de gala LIONGATE · 28 novembre 2026" : "LIONGATE gala evening · 28 November 2026";
    $("#progLbl").textContent = U().programme; $("#progBtn").setAttribute("aria-label", U().programme); $("#soundLbl").textContent = U().sound; fsLabel();
    sceneKey = ""; secKey = ""; tick();
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { if (b.dataset.lang !== lang) setLang(b.dataset.lang); }));

  // ---------- Full screen ----------
  const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (!fsOK) $("#fsBtn").style.display = "none";
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function fsLabel() { $("#fsLbl").textContent = isFs() ? U().exitFull : U().full; $("#fsBtn").setAttribute("aria-label", isFs() ? U().exitFull : U().full); }
  function toggleFs() {
    if (!fsOK) return;
    if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement, r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
    if (!soundOn) setSound(true); // the operator's click also unlocks the sound
  }
  $("#fsBtn").addEventListener("click", toggleFs);
  document.addEventListener("fullscreenchange", () => { fsLabel(); layout(); idle(); });
  document.addEventListener("webkitfullscreenchange", () => { fsLabel(); layout(); idle(); });

  // Hide cursor and tools after 2 s without movement (full screen or ?ecran=1)
  let idleT;
  function idle() { document.body.classList.remove("hide-cursor"); clearTimeout(idleT); if (isFs() || SCREEN) idleT = setTimeout(() => document.body.classList.add("hide-cursor"), 2000); }
  addEventListener("mousemove", idle, { passive: true });

  // ---------- Keyboard (presentation clickers send arrows / PageUp / PageDown) ----------
  addEventListener("keydown", e => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if ((e.key === " " || e.key === "Enter") && e.target.closest && e.target.closest("button,a")) return;
    if (e.key === "Escape" && $("#drawer").classList.contains("open")) { closeDrawer(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "f" || e.key === "F") { toggleFs(); return; }
    if (e.key === "m" || e.key === "M") { setSound(!soundOn); return; }
    const fwd = ["ArrowRight", "PageDown", "ArrowDown", " "].includes(e.key), back = ["ArrowLeft", "PageUp", "ArrowUp"].includes(e.key);
    if ((fwd || back) && document.body.classList.contains("s-talk")) {
      e.preventDefault(); const sch = schedule(), cur = units[sch.current];
      if (cur) { const sec = currentSection(cur, sch.units[sch.current], now()); if (sec && sec.n > 1) { manual = { id: cur.id, k: sec.k + (fwd ? 1 : -1), at: now() }; tick(); } }
    }
  });

  // ---------- Start ----------
  document.documentElement.lang = lang;
  setLang(lang);
  layout(); idle();
  setInterval(tick, 250);
  if (G.liveUrl) { poll().then(tick); setInterval(poll, (SCREEN ? Math.max(5, G.pollSeconds || 10) : 30) * 1000); }
  // Room screen: warm the spot files during the evening so the projection starts instantly
  if (SCREEN) setTimeout(() => (G.media.spots || []).forEach(x => { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = x.src; v.style.display = "none"; document.body.appendChild(v); }), 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll().then(tick); } });
})();
</script>
</body>
</html>
